<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prisma Hub Vitality</title>
<script src="https://cdn.tailwindcss.com"></script>
<style>
  body { background: #0a0e14; font-family: 'Inter', system-ui, sans-serif; }
  .glass { background: rgba(20, 28, 40, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.06); }
  .glow { box-shadow: 0 0 20px rgba(34, 197, 94, 0.15); }
  .vitality-bar { background: linear-gradient(90deg, #22c55e, #14b8a6); }
  .pulse-dot { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  input, textarea, select { background: #131923; border: 1px solid #2a3548; color: #e2e8f0; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #22c55e; }
  .step-active { color: #22c55e; border-bottom: 2px solid #22c55e; }
  .step { color: #64748b; border-bottom: 2px solid transparent; transition: all 0.2s; }
  .step:hover { color: #94a3b8; }
  .step-done { color: #22c55e; }
  .step-done::after { content: ' ✓'; }
  .fade-in { animation: fadeIn 0.3s; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
</style>
</head>
<body class="text-slate-200 min-h-screen">

<!-- Header -->
<div class="glass sticky top-0 z-50 px-6 py-3 flex items-center gap-4 flex-wrap">
  <div class="flex items-center gap-2">
    <div class="w-3 h-3 rounded-full bg-green-500 pulse-dot"></div>
    <h1 class="text-lg font-bold tracking-tight">Prisma Hub Vitality</h1>
  </div>
  <div class="flex-1"></div>
  <div class="flex items-center gap-2 text-sm">
    <label class="text-slate-500">AppView</label>
    <input id="appview-url" class="rounded px-2 py-1 w-56 text-xs" placeholder="https://prisma-indexer.onrender.com">
  </div>
  <div class="flex items-center gap-2 text-sm">
    <label class="text-slate-500">PDS</label>
    <input id="pds-url" class="rounded px-2 py-1 w-56 text-xs" placeholder="http://localhost:3000">
  </div>
  <button id="save-config" class="px-3 py-1 rounded bg-slate-700 hover:bg-slate-600 text-xs">Save</button>
  <button id="wallet-btn" class="px-3 py-1 rounded bg-green-600 hover:bg-green-500 text-xs font-medium">Connect Wallet</button>
  <span id="session-status" class="text-xs text-slate-500">Not signed in</span>
</div>

<!-- Stepper -->
<nav id="stepper" class="px-6 pt-4 flex gap-6 text-sm font-medium">
  <button class="step step-active pb-2" data-step="connect">1. Connect</button>
  <button class="step pb-2" data-step="register">2. Register</button>
  <button class="step pb-2" data-step="build">Publish</button>
  <button class="step pb-2" data-step="library">Library</button>
</nav>

<!-- Content -->
<main id="content" class="px-6 py-6"></main>

<!-- Toast -->
<div id="toast" class="fixed bottom-6 right-6 hidden glass px-4 py-3 rounded-lg text-sm glow"></div>

<script>
// ─── Bech32 ───────────────────────────────────────────────────
const BECH32_ALPHABET = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
const BECH32_ALPHABET_MAP = {};
for (let z = 0; z < BECH32_ALPHABET.length; z++) BECH32_ALPHABET_MAP[BECH32_ALPHABET.charAt(z)] = z;
function bech32PolymodStep(pre) {
  const b = pre >> 25;
  return (((pre & 0x1ffffff) << 5) ^
    (-((b >> 0) & 1) & 0x3b6a57b2) ^
    (-((b >> 1) & 1) & 0x26508e6d) ^
    (-((b >> 2) & 1) & 0x1ea119fa) ^
    (-((b >> 3) & 1) & 0x3d4233dd) ^
    (-((b >> 4) & 1) & 0x2a1462b3));
}
function bech32PrefixChk(prefix) {
  let chk = 1;
  for (let i = 0; i < prefix.length; ++i) {
    const c = prefix.charCodeAt(i);
    if (c < 33 || c > 126) return 'Invalid prefix (' + prefix + ')';
    chk = bech32PolymodStep(chk) ^ (c >> 5);
  }
  chk = bech32PolymodStep(chk);
  for (let i = 0; i < prefix.length; ++i) {
    chk = bech32PolymodStep(chk) ^ (prefix.charCodeAt(i) & 0x1f);
  }
  return chk;
}
function bech32Convert(data, inBits, outBits, pad) {
  let value = 0, bits = 0, maxV = (1 << outBits) - 1, result = [];
  for (let i = 0; i < data.length; ++i) {
    value = (value << inBits) | data[i]; bits += inBits;
    while (bits >= outBits) { bits -= outBits; result.push((value >> bits) & maxV); }
  }
  if (pad) { if (bits > 0) result.push((value << (outBits - bits)) & maxV); }
  else { if (bits >= inBits) return 'Excess padding'; if ((value << (outBits - bits)) & maxV) return 'Non-zero padding'; }
  return result;
}
function bech32ToWords(bytes) { return bech32Convert(bytes, 8, 5, true); }
function bech32Encode(prefix, words) {
  let chk = bech32PrefixChk(prefix);
  if (typeof chk === 'string') throw new Error(chk);
  let result = prefix.toLowerCase() + '1';
  for (let i = 0; i < words.length; ++i) {
    const x = words[i];
    if (x >> 5 !== 0) throw new Error('Non 5-bit word');
    chk = bech32PolymodStep(chk) ^ x;
    result += BECH32_ALPHABET.charAt(x);
  }
  for (let i = 0; i < 6; ++i) chk = bech32PolymodStep(chk);
  chk ^= 1;
  for (let i = 0; i < 6; ++i) result += BECH32_ALPHABET.charAt((chk >> ((5 - i) * 5)) & 0x1f);
  return result;
}
function hexToStakeAddress(hex) {
  const bytes = [];
  for (let i = 0; i < hex.length; i += 2) bytes.push(parseInt(hex.substr(i, 2), 16));
  const isMainnet = (bytes[0] & 0x0f) === 1;
  const hrp = isMainnet ? 'stake' : 'stake_test';
  return bech32Encode(hrp, bech32ToWords(bytes));
}

// ─── State ────────────────────────────────────────────────────
let appviewUrl = localStorage.getItem('appview-url') || '';
let pdsUrl = localStorage.getItem('pds-url') || '';
let sessionToken = null;
let sessionDid = null;
let walletApi = null;
let rewardAddress = null;
let currentStep = 'connect';
let hubCreated = false;
let selectedRole = null;
let selectedRoleName = null;

document.getElementById('appview-url').value = appviewUrl;
document.getElementById('pds-url').value = pdsUrl;

// ─── Helpers ──────────────────────────────────────────────────
function val(id) { return document.getElementById(id)?.value?.trim() || ''; }
function rkey() { return Math.random().toString(36).slice(2, 12); }
function now() { return new Date().toISOString(); }

function short(str, n = 12) {
  if (!str) return '—';
  if (str.length <= n) return str;
  return str.slice(0, n) + '…';
}

function copyable(str, label = 'Copy') {
  if (!str) return '<span class="text-slate-600">—</span>';
  const id = 'copy-' + Math.random().toString(36).slice(2, 8);
  return `<span class="font-mono text-slate-500 cursor-pointer hover:text-green-400" id="${id}" title="${label}: ${str}" onclick="navigator.clipboard.writeText('${str}'); this.style.color='#22c55e'; setTimeout(() => this.style.color='', 1000)">${short(str)}</span>`;
}

function toast(msg, isError = false) {
  const el = document.getElementById('toast');
  el.textContent = msg;
  el.classList.toggle('text-red-400', isError);
  el.classList.toggle('text-slate-200', !isError);
  el.classList.remove('hidden');
  setTimeout(() => el.classList.add('hidden'), 4000);
}

function emptyState(title, sub) {
  return `<div class="text-center py-16"><div class="text-slate-400 text-lg mb-2">${title}</div><div class="text-slate-600 text-sm">${sub}</div></div>`;
}

function errorBox(err) {
  return `<div class="text-red-400 text-sm">${err.message}</div><div class="text-slate-500 text-xs mt-2">Make sure the AppView URL is set and the service is running.</div>`;
}

// ─── API ──────────────────────────────────────────────────────
async function appviewGet(path) {
  if (!appviewUrl) throw new Error('Set the AppView URL first');
  const resp = await fetch(`${appviewUrl}${path}`);
  if (!resp.ok) throw new Error(`AppView ${resp.status}: ${await resp.text()}`);
  return resp.json();
}

async function pdsPost(path, body) {
  if (!pdsUrl) throw new Error('Set the PDS URL first');
  const headers = { 'Content-Type': 'application/json' };
  if (sessionToken) headers['Authorization'] = 'Bearer ' + sessionToken;
  let resp;
  try {
    resp = await fetch(`${pdsUrl}${path}`, { method: 'POST', headers, body: JSON.stringify(body) });
  } catch (e) {
    throw new Error(`Cannot reach PDS at ${pdsUrl} — is it running? (${e.message})`);
  }
  const text = await resp.text();
  if (!resp.ok) throw new Error(`PDS ${resp.status}: ${text}`);
  return text ? JSON.parse(text) : {};
}

// ─── Wallet ───────────────────────────────────────────────────
document.getElementById('wallet-btn').addEventListener('click', walletSignIn);

async function walletSignIn() {
  console.log('walletSignIn called, pdsUrl=', pdsUrl);
  if (!pdsUrl) { toast('Set the PDS URL first', true); return; }
  try {
    console.log('window.cardano keys:', Object.keys(window.cardano || {}));
    const wallets = Object.keys(window.cardano || {}).filter(k => window.cardano[k].enable);
    console.log('available wallets:', wallets);
    if (wallets.length === 0) { toast('No Cardano wallet found. Install Eternl, Nami, or Lace.', true); return; }

    // Try each wallet until one works
    let enabled = null;
    let walletName = null;
    for (const w of wallets) {
      console.log('trying wallet:', w);
      try {
        enabled = await window.cardano[w].enable();
        walletName = w;
        walletApi = enabled;
        console.log('wallet enabled:', w);
        break;
      } catch (e) {
        console.log('wallet', w, 'failed:', e.message);
        toast(`${w} failed: ${e.message}, trying next...`);
      }
    }
    if (!enabled || !walletName) { throw new Error('No wallet could be enabled. Make sure a Cardano wallet is installed and unlocked.'); }
    toast(`Connected to ${walletName}`);

    let rewardAddresses;
    try {
      rewardAddresses = await walletApi.getRewardAddresses();
    } catch (gaErr) {
      console.error('getRewardAddresses error:', gaErr);
      throw new Error('Could not get reward addresses: ' + gaErr.message);
    }
    console.log('rewardAddresses:', rewardAddresses);
    if (!rewardAddresses || rewardAddresses.length === 0) { toast('No reward address', true); return; }
    rewardAddress = rewardAddresses[0];
    console.log('rewardAddress raw:', rewardAddress, 'type:', typeof rewardAddress);
    
    // getRewardAddresses returns hex-encoded bytes (e.g. "e045694e...")
    // The DID uses the bech32 stake address, but signData wants the hex address
    const stakeAddress = typeof rewardAddress === 'string' && rewardAddress.startsWith('stake')
      ? rewardAddress
      : hexToStakeAddress(rewardAddress);
    const did = `did:cardano:${stakeAddress}`;
    console.log('DID:', did);

    toast('Requesting challenge...');
    const challenge = await pdsPost('/xrpc/com.prisma.auth.getChallenge', { did });
    console.log('Challenge:', challenge);
    
    // CIP-30 signData takes (address, hexPayload)
    // address = the hex-encoded address bytes (what getRewardAddresses returned)
    // hexPayload = hex-encoded bytes of the challenge message
    const challengeBytes = new TextEncoder().encode(challenge.challenge);
    const hexPayload = Array.from(challengeBytes).map(b => b.toString(16).padStart(2, '0')).join('');
    console.log('hexPayload:', hexPayload);
    
    toast('Waiting for wallet signature...');
    let sigResult;
    try {
      sigResult = await walletApi.signData(rewardAddress, hexPayload);
      console.log('signData result:', sigResult);
    } catch (signErr) {
      console.error('signData error:', signErr);
      throw new Error('Wallet rejected the signature request: ' + signErr.message);
    }
    if (!sigResult || !sigResult.signature || !sigResult.key) { throw new Error('Wallet did not return a valid signature'); }
    const { signature, key } = sigResult;
    toast('Signing in...');
    const session = await pdsPost('/xrpc/com.prisma.auth.login', { nonce: challenge.nonce, signature, key });

    sessionToken = session.token;
    sessionDid = session.did;
    const btn = document.getElementById('wallet-btn');
    btn.textContent = 'Signed In';
    btn.classList.remove('bg-green-600', 'hover:bg-green-500');
    btn.classList.add('bg-green-800');
    const st = document.getElementById('session-status');
    st.textContent = short(sessionDid, 20);
    st.className = 'text-xs text-green-400';
    toast('Signed in!');
    updateStepper();
    loadStep();
  } catch (err) { console.error('walletSignIn FULL ERROR:', err); toast('Sign-in failed: ' + err.message, true); }
}

// ─── Stepper ──────────────────────────────────────────────────
document.getElementById('save-config').addEventListener('click', () => {
  appviewUrl = document.getElementById('appview-url').value.replace(/\/$/, '');
  pdsUrl = document.getElementById('pds-url').value.replace(/\/$/, '');
  localStorage.setItem('appview-url', appviewUrl);
  localStorage.setItem('pds-url', pdsUrl);
  toast('Config saved');
  loadStep();
});

document.querySelectorAll('.step').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.step').forEach(t => t.classList.remove('step-active'));
    btn.classList.add('step-active');
    currentStep = btn.dataset.step;
    loadStep();
  });
});

function updateStepper() {
  const steps = ['connect', 'register', 'build', 'vitality'];
  steps.forEach((s, i) => {
    const btn = document.querySelector(`[data-step="${s}"]`);
    if (!btn) return;
    btn.classList.remove('step-active');
    if (sessionToken && i >= 1) btn.classList.add('step-done');
    if (hubCreated && i >= 2) btn.classList.add('step-done');
    if (s === currentStep) btn.classList.add('step-active');
  });
}

function loadStep() {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="text-slate-500 text-sm">Loading...</div>';
  updateStepper();
  switch (currentStep) {
    case 'connect': renderConnect(); break;
    case 'register': renderRegister(); break;
    case 'build': renderPublish(); break;
    case 'library': renderLibrary(); break;
  }
}

// ─── Step 1: Connect ──────────────────────────────────────────
function renderConnect() {
  const c = document.getElementById('content');
  const signedIn = sessionToken && sessionDid;
  c.innerHTML = `
    <div class="max-w-2xl mx-auto fade-in">
      <div class="glass rounded-xl p-8 mb-6">
        <h2 class="text-xl font-bold text-green-300 mb-2">Welcome to Prisma Hub Vitality</h2>
        <p class="text-slate-400 text-sm mb-6">Your data stays on your disk. Signed, content-addressed, yours. This is a 4-step flow: connect your wallet, register your hub, build your records, and see your vitality.</p>
        <div class="space-y-4">
          <div class="flex items-center gap-3 ${signedIn ? 'text-green-400' : 'text-slate-500'}">
            <span class="text-lg">${signedIn ? '✅' : '⬜'}</span>
            <span class="text-sm">1. Set your PDS and AppView URLs (top bar)</span>
          </div>
          <div class="flex items-center gap-3 ${signedIn ? 'text-green-400' : 'text-slate-500'}">
            <span class="text-lg">${signedIn ? '✅' : '⬜'}</span>
            <span class="text-sm">2. Connect your Cardano wallet (top-right button)</span>
          </div>
          <div class="flex items-center gap-3 text-slate-500">
            <span class="text-lg">⬜</span>
            <span class="text-sm">3. Register your hub and choose a role</span>
          </div>
          <div class="flex items-center gap-3 text-slate-500">
            <span class="text-lg">⬜</span>
            <span class="text-sm">4. Build records (projects, interviews, milestones, budgets)</span>
          </div>
          <div class="flex items-center gap-3 text-slate-500">
            <span class="text-lg">⬜</span>
            <span class="text-sm">5. View your hub vitality on the dashboard</span>
          </div>
        </div>
      </div>
      ${signedIn ? `
        <div class="glass rounded-xl p-6 glow">
          <div class="flex items-center gap-3 mb-4">
            <span class="text-2xl">✅</span>
            <div>
              <h3 class="font-semibold text-green-300">Wallet connected</h3>
              <div class="text-xs text-slate-500 mt-1">${copyable(sessionDid, 'Copy DID')}</div>
            </div>
          </div>
          <button onclick="document.querySelector('[data-step=\\'register\\']').click()" class="w-full px-4 py-3 rounded bg-green-600 hover:bg-green-500 text-sm font-medium">Continue to Registration →</button>
        </div>
      ` : `
        <div class="glass rounded-xl p-6 text-center">
          <p class="text-slate-400 text-sm mb-4">Click "Connect Wallet" in the top-right to begin.</p>
          <button onclick="walletSignIn()" class="px-6 py-3 rounded bg-green-600 hover:bg-green-500 text-sm font-medium">Connect Wallet</button>
        </div>
      `}
    </div>
  `;
}

// ─── Step 2: Register ─────────────────────────────────────────
const STAKEHOLDER_TYPES = [
  { name: 'Participant', id: 'ODpx0p', description: 'Individuals', icon: '👤' },
  { name: 'Community of Place', id: '5BkzBo', description: 'Bioregional hubs & locals', icon: '🌍' },
  { name: 'Community of Practice', id: 'n9J7rK', description: 'Network representatives', icon: '🔗' },
  { name: 'Partner', id: 'wQB7El', description: 'Technologies, funders, institutions', icon: '🤝' },
];

function renderRegister() {
  const c = document.getElementById('content');
  if (!sessionToken) {
    c.innerHTML = emptyState('Not signed in', 'Connect your wallet first (step 1).');
    return;
  }

  // Check if hub already exists
  c.innerHTML = '<div class="text-slate-500 text-sm">Checking your hub...</div>';
  checkHubExists().then(exists => {
    hubCreated = exists;
    updateStepper();
    if (exists) {
      renderHubOverview();
    } else {
      renderRegistrationForm();
    }
  }).catch(() => renderRegistrationForm());
}

async function checkHubExists() {
  if (!sessionDid) return false;
  try {
    const resp = await fetch(`${pdsUrl}/xrpc/com.prisma.sync.getLatestCommit?did=${encodeURIComponent(sessionDid)}`);
    if (!resp.ok) return false;
    const r = await resp.json();
    return r.rev > 0;
  } catch { return false; }
}

async function renderHubOverview() {
  const c = document.getElementById('content');
  let hubInfo = null;
  try {
    const hubsRes = await appviewGet('/api/research/hubs');
    hubInfo = (hubsRes.hubs || []).find(h => h.did === sessionDid);
  } catch {}

  c.innerHTML = `
    <div class="max-w-2xl mx-auto fade-in">
      <div class="glass rounded-xl p-6 mb-6 glow">
        <div class="flex items-center gap-3 mb-4">
          <span class="text-2xl">✅</span>
          <div>
            <h3 class="font-semibold text-green-300">Hub registered</h3>
            <div class="text-xs text-slate-500 mt-1">Your hub is live on your PDS</div>
          </div>
        </div>
        ${hubInfo ? `
          <div class="space-y-2 text-sm text-slate-300">
            <div><span class="text-slate-600">Name:</span> ${hubInfo.name}</div>
            <div><span class="text-slate-600">Role:</span> ${hubInfo.stakeholder_type}</div>
            <div><span class="text-slate-600">DID:</span> ${copyable(hubInfo.did, 'Copy DID')}</div>
            <div><span class="text-slate-600">Wallet:</span> ${copyable(hubInfo.wallet_address, 'Copy wallet')}</div>
            <div><span class="text-slate-600">Enrolled:</span> ${hubInfo.enrolled_at || '—'}</div>
          </div>
        ` : '<div class="text-xs text-slate-500">Hub exists on PDS, waiting for indexer...</div>'}
      </div>
      <button onclick="document.querySelector('[data-step=\\'build\\']').click()" class="w-full px-4 py-3 rounded bg-green-600 hover:bg-green-500 text-sm font-medium">Continue to Build →</button>
    </div>
  `;
  hubCreated = true;
  updateStepper();
}

function renderRegistrationForm() {
  const c = document.getElementById('content');
  if (selectedRole) {
    renderRegistrationDetails();
  } else {
    c.innerHTML = `
      <div class="max-w-3xl mx-auto fade-in">
        <div class="text-center mb-6">
          <h2 class="text-xl font-bold text-green-300 mb-2">Choose your role</h2>
          <p class="text-slate-400 text-sm">This creates your hub on your PDS. Your first commit is your enrollment.</p>
        </div>
        <div class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-4 gap-4">
          ${STAKEHOLDER_TYPES.map(t => `
            <div class="glass rounded-xl p-6 cursor-pointer hover:border-green-500/30 transition text-center" onclick="selectRole('${t.id}','${t.name}')">
              <div class="text-4xl mb-3">${t.icon}</div>
              <h3 class="font-semibold text-green-300 mb-1">${t.name}</h3>
              <p class="text-xs text-slate-500">${t.description}</p>
            </div>
          `).join('')}
        </div>
      </div>
    `;
  }
}

function selectRole(id, name) {
  selectedRole = id;
  selectedRoleName = name;
  renderRegistrationDetails();
}

function renderRegistrationDetails() {
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="max-w-2xl mx-auto fade-in">
      <div class="glass rounded-xl p-6 mb-6">
        <div class="text-xs text-slate-500 mb-1">Selected role</div>
        <div class="text-lg font-semibold text-green-300 mb-4">${selectedRoleName}</div>
        <div class="space-y-4">
          <div><label class="text-xs text-slate-500">Name</label>
            <input id="reg-name" class="w-full rounded px-3 py-2 mt-1 text-sm" placeholder="Your name or hub name"></div>
          <div><label class="text-xs text-slate-500">Wallet Address</label>
            <input id="reg-wallet" class="w-full rounded px-3 py-2 mt-1 text-sm" placeholder="addr1... or addr_test1..."></div>
          <div><label class="text-xs text-slate-500">Region / Location</label>
            <input id="reg-region" class="w-full rounded px-3 py-2 mt-1 text-sm" placeholder="e.g. Nairobi, Kenya"></div>
        </div>
      </div>
      <div class="flex gap-3">
        <button onclick="selectedRole=null; selectedRoleName=null; renderRegistrationForm()" class="px-4 py-2 rounded bg-slate-700 hover:bg-slate-600 text-sm">← Back</button>
        <button id="reg-submit" onclick="submitRegistration()" class="flex-1 px-4 py-3 rounded bg-green-600 hover:bg-green-500 text-sm font-medium">Register & Create Hub →</button>
      </div>
    </div>
  `;
}

async function submitRegistration() {
  const btn = document.getElementById('reg-submit');
  if (!btn) { toast('Button not found', true); return; }
  if (btn) { btn.disabled = true; btn.textContent = 'Creating...'; }
  try {
    if (!sessionDid) { toast('Not signed in — connect your wallet first', true); return; }
    const name = val('reg-name');
    if (!name) { toast('Name required', true); if (btn) { btn.disabled = false; btn.textContent = 'Register & Create Hub →'; } return; }
    const stakeholderType = selectedRole || 'ODpx0p';
    const walletAddress = val('reg-wallet') || 'unknown';
    const region = val('reg-region');

    console.log('submitRegistration: sessionDid=', sessionDid, 'name=', name, 'role=', stakeholderType);

    toast('Creating hub repo...');
    try {
      await pdsPost('/xrpc/com.prisma.repo.initiateRepo', {
        did: sessionDid, stakeholder_type: stakeholderType, name, wallet_address: walletAddress
      });
    } catch (e) {
      if (e.message.includes('409') || e.message.includes('already exists')) {
        toast('Hub repo already exists — continuing...');
      } else { throw e; }
    }
    toast('Recording enrollment...');
    const enrollRes = await pdsPost('/xrpc/com.prisma.repo.createRecord', {
      collection: 'prisma.events.enrollment', rkey: 'self',
      stakeholder_type: stakeholderType, submission_id: 'signup', respondent_id: 'signup',
      name, wallet_address: walletAddress, did: sessionDid, enrolled_at: now()
    });
    console.log('enrollment res:', enrollRes);
    if (region) {
      toast('Creating project...');
      const projRes = await pdsPost('/xrpc/com.prisma.repo.createRecord', {
        collection: 'prisma.events.project', rkey: rkey(),
        name, impactArea: region, createdAt: now()
      });
      console.log('project res:', projRes);
    }
    hubCreated = true;
    toast('Hub registered!');
    setTimeout(() => { document.querySelector('[data-step="build"]').click(); }, 1000);
  } catch (e) { console.error('submitRegistration error:', e); toast(e.message, true); if (btn) { btn.disabled = false; btn.textContent = 'Register & Create Hub →'; } }
}

async function publishAll() {
  const btn = document.getElementById('pub-submit');
  if (btn) { btn.disabled = true; btn.textContent = 'Publishing...'; }
  const results = [];
  const projectName = val('pub-project-name');

  try {
    // 1. Project
    if (projectName) {
      toast('Writing project...');
      const r = await pdsPost('/xrpc/com.prisma.repo.createRecord', {
        collection: 'prisma.events.project', rkey: rkey(),
        name: projectName, impactArea: val('pub-project-impact'), createdAt: now()
      });
      results.push('Project');
    }

    // 2. Interview
    const ivTitle = val('pub-iv-title');
    if (ivTitle) {
      toast('Writing interview...');
      const r = await pdsPost('/xrpc/com.prisma.repo.createRecord', {
        collection: 'prisma.events.interview', rkey: rkey(), title: ivTitle,
        subject: { uri: projectName ? sessionDid + '/' + rkey() : '', cid: '' },
        consent: val('pub-iv-consent'), notes: val('pub-iv-notes'), createdAt: now()
      });
      results.push('Interview');
    }

    // 3. Milestone
    const msName = val('pub-ms-name');
    if (msName) {
      toast('Writing milestone...');
      const r = await pdsPost('/xrpc/com.prisma.repo.createRecord', {
        collection: 'prisma.events.milestoneProgress', rkey: rkey(),
        hubName: projectName || 'Hub', milestone: msName, status: val('pub-ms-status'), completedAt: now()
      });
      results.push('Milestone');
    }

    // 4. Budget
    if (val('pub-bg-total') || val('pub-bg-earned')) {
      toast('Writing budget...');
      const r = await pdsPost('/xrpc/com.prisma.repo.createRecord', {
        collection: 'prisma.events.budgetAllocation', rkey: rkey(),
        hubName: projectName || 'Hub', location: val('pub-bg-loc'),
        totalAda: val('pub-bg-total') || '0', earnedAda: val('pub-bg-earned') || '0',
        interviewsDone: parseInt(val('pub-bg-done')) || 0, interviewsTarget: parseInt(val('pub-bg-target')) || 0,
        playbookStatus: 'draft'
      });
      results.push('Budget');
    }

    // 5. Local team
    if (val('pub-lt-name')) {
      toast('Writing team member...');
      const r = await pdsPost('/xrpc/com.prisma.repo.createRecord', {
        collection: 'prisma.events.localTeam', rkey: rkey(),
        teamName: val('pub-lt-name'), teamDid: val('pub-lt-did'),
        walletAddress: val('pub-lt-wallet'), hubName: sessionDid,
        region: val('pub-lt-region'), interviewsDone: 0, earnedAda: '0'
      });
      results.push('Team member');
    }

    // 6. Playbook
    if (val('pub-pb-title')) {
      toast('Writing playbook section...');
      const r = await pdsPost('/xrpc/com.prisma.repo.createRecord', {
        collection: 'prisma.events.playbookSection', rkey: rkey(),
        hubName: projectName || 'Hub', region: val('pub-pb-region'),
        section: val('pub-pb-section'), title: val('pub-pb-title'),
        content: val('pub-pb-content'), status: 'published', author: 'self', createdAt: now()
      });
      results.push('Playbook');
    }

    // 7. Video
    const vidFile = document.getElementById('pub-vid-file');
    if (vidFile && vidFile.files && vidFile.files[0]) {
      const file = vidFile.files[0];
      console.log('Video upload:', file.name, file.size, 'bytes,', file.type);
      if (file.size <= 50 * 1024 * 1024) {
        toast(`Uploading video (${Math.round(file.size / 1024 / 1024 * 10) / 10}MB)...`);
        const bytes = new Uint8Array(await file.arrayBuffer());
        const headers = { 'Content-Type': 'application/octet-stream' };
        if (sessionToken) headers['Authorization'] = 'Bearer ' + sessionToken;
        try {
          const resp = await fetch(`${pdsUrl}/xrpc/com.prisma.repo.uploadBlob?did=${encodeURIComponent(sessionDid)}`, {
            method: 'POST', headers, body: bytes
          });
          const text = await resp.text();
          console.log('Video upload response:', resp.status, text);
          if (!resp.ok) throw new Error(`PDS ${resp.status}: ${text}`);
          const blobRes = JSON.parse(text);
          await pdsPost('/xrpc/com.prisma.repo.createRecord', {
            collection: 'prisma.events.playbookSection', rkey: rkey(),
            hubName: projectName || 'Hub', region: 'media', section: 'video',
            title: file.name, content: 'Video blob CID: ' + blobRes.cid,
            status: 'published', author: 'self', createdAt: now()
          });
          results.push('Video');
        } catch (vidErr) {
          console.error('Video upload error:', vidErr);
          toast('Video upload failed: ' + vidErr.message, true);
        }
      } else { toast('Video too large (max 50MB), skipped', true); }
    }

    toast(`Published ${results.length} record${results.length === 1 ? '' : 's'}: ${results.join(', ')}`);
    if (btn) { btn.disabled = false; btn.textContent = 'Publish All Records →'; }
    setTimeout(() => { document.querySelector('[data-step="library"]').click(); }, 2000);
  } catch (e) {
    console.error('publishAll error:', e);
    toast(e.message, true);
    if (btn) { btn.disabled = false; btn.textContent = 'Publish All Records →'; }
  }
}

// ─── Step 4: Library (read all hubs' gazettes) ────────────────
async function renderLibrary() {
  const c = document.getElementById('content');
  c.innerHTML = '<div class="text-slate-500 text-sm">Loading the library...</div>';

  try {
    const [hubsRes, csRes, ecRes] = await Promise.all([
      appviewGet('/api/research/hubs'),
      appviewGet('/api/research/case-studies'),
      appviewGet('/api/research/event-contract')
    ]);

    const hubs = hubsRes.hubs || [];
    const caseStudies = csRes.case_studies || [];
    const ec = ecRes;
    const milestones = ec.milestones || [];
    const budgets = ec.budgets || [];
    const teams = ec.local_teams || [];
    const playbook = ec.playbook_sections || [];

    if (hubs.length === 0) {
      c.innerHTML = `<div class="max-w-2xl mx-auto fade-in">
        <div class="glass rounded-xl p-8 text-center mb-6">
          <h2 class="text-lg font-bold text-green-300 mb-2">The Library is empty</h2>
          <p class="text-slate-400 text-sm mb-6">No hubs have published yet. ${sessionToken ? 'Publish your research to be the first.' : 'Register and publish to be the first.'}</p>
          ${sessionToken
            ? `<button onclick="document.querySelector('[data-step=\\'build\\']').click()" class="px-6 py-3 rounded bg-green-600 hover:bg-green-500 text-sm font-medium">Publish Research →</button>`
            : `<button onclick="document.querySelector('[data-step=\\'register\\']').click()" class="px-6 py-3 rounded bg-green-600 hover:bg-green-500 text-sm font-medium">Register Your Hub →</button>`}
        </div>
      </div>`;
      return;
    }

    // Group records by hub
    let html = '<div class="max-w-5xl mx-auto fade-in">';
    html += `<div class="text-center mb-6"><h2 class="text-xl font-bold text-green-300">The Research Library</h2><p class="text-slate-400 text-sm mt-1">${hubs.length} hub${hubs.length === 1 ? '' : 's'} · ${caseStudies.length} case stud${caseStudies.length === 1 ? 'y' : 'ies'} · ${milestones.length} milestones · ${playbook.length} playbook sections</p></div>`;

    // Vitality overview across all hubs
    const totalDone = budgets.reduce((s, b) => s + b.interviews_done, 0);
    const totalTarget = budgets.reduce((s, b) => s + b.interviews_target, 0);
    const pct = totalTarget > 0 ? Math.round((totalDone / totalTarget) * 100) : 0;

    html += `<div class="glass rounded-xl p-6 mb-6">
      <h3 class="text-sm font-medium text-slate-300 mb-3">Cross-hub Progress</h3>
      <div class="w-full bg-slate-800 rounded-full h-4 overflow-hidden mb-2">
        <div class="vitality-bar h-4 rounded-full" style="width: ${pct}%"></div>
      </div>
      <div class="text-right text-xs text-slate-500">${totalDone}/${totalTarget} interviews across all hubs (${pct}%)</div>
    </div>`;

    // Each hub as a gazette
    for (const hub of hubs) {
      const hubProjects = caseStudies.filter(cs => cs.did === hub.did);
      const hubMs = milestones.filter(m => m.did === hub.did);
      const hubBg = budgets.filter(b => b.did === hub.did);
      const hubTeams = teams.filter(t => t.did === hub.did);
      const hubPb = playbook.filter(p => p.did === hub.did);
      const hubInterviews = hubProjects.flatMap(p => (p.interviews || []));
      const recordCount = hubProjects.length + hubMs.length + hubBg.length + hubTeams.length + hubPb.length;

      const today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

      html += `<div class="glass rounded-xl p-6 mb-6" style="font-family: Georgia, serif;">
        <div style="border-top: 3px double #22c55e; border-bottom: 3px double #22c55e; padding: 1rem 0; text-align: center; margin-bottom: 1rem;">
          <div style="font-size: 1.5rem; font-weight: 900; color: #bbf7d0; letter-spacing: 0.05em;">${hub.name}</div>
          <div style="font-size: 0.7rem; color: #64748b; letter-spacing: 0.15em; text-transform: uppercase; margin-top: 0.3rem;">${hub.stakeholder_type} · ${today}</div>
          <div style="font-size: 0.65rem; color: #475569; margin-top: 0.2rem;">${copyable(hub.did)}</div>
        </div>`;

      if (recordCount === 0) {
        html += `<p style="color: #64748b; font-size: 0.85rem; text-align: center;">No records published yet.</p>`;
      } else {
        if (hubProjects.length > 0) {
          html += `<div style="margin-bottom: 1rem;"><div style="font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: #22c55e;">Case Studies</div>`;
          for (const p of hubProjects) {
            html += `<p style="font-size: 0.85rem; color: #cbd5e1; margin: 0.3rem 0;"><strong>${p.name}</strong> — ${p.impact_area || '—'}. ${copyable(p.cid)}</p>`;
          }
          html += `</div>`;
        }

        if (hubInterviews.length > 0) {
          html += `<div style="margin-bottom: 1rem;"><div style="font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: #22c55e;">Interviews</div>`;
          for (const iv of hubInterviews) {
            const cColor = iv.consent === 'public' ? '#22c55e' : iv.consent === 'anonymous' ? '#eab308' : '#ef4444';
            html += `<p style="font-size: 0.85rem; color: #cbd5e1; margin: 0.3rem 0;"><strong>${iv.title}</strong> <span style="color:${cColor}; font-size:0.7rem;">${iv.consent}</span>${iv.notes ? ' — ' + iv.notes.slice(0, 100) : ''}</p>`;
          }
          html += `</div>`;
        }

        if (hubMs.length > 0) {
          html += `<div style="margin-bottom: 1rem;"><div style="font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: #22c55e;">Milestones</div>`;
          for (const m of hubMs) {
            const done = m.status === 'done' || m.status === 'completed';
            html += `<p style="font-size: 0.85rem; color: #cbd5e1; margin: 0.3rem 0;">${done ? '■' : '□'} <strong>${m.milestone}</strong> — <em style="color:${done ? '#22c55e' : '#94a3b8'}">${m.status}</em></p>`;
          }
          html += `</div>`;
        }

        if (hubBg.length > 0) {
          html += `<div style="margin-bottom: 1rem;"><div style="font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: #22c55e;">Budget</div>`;
          for (const b of hubBg) {

          }
          html += `</div>`;
        }

        if (hubTeams.length > 0) {
          html += `<div style="margin-bottom: 1rem;"><div style="font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: #22c55e;">Team</div>`;
          for (const t of hubTeams) {

          }

        if (hubPb.length > 0) {

      }

      html += `<div style="text-align: center; color: #22c55e; font-size: 0.8rem; letter-spacing: 0.5em;">■ ■ ■</div>`;
      html += `</div>`;
    }

    html += `<button onclick="renderLibrary()" class="w-full px-4 py-3 rounded bg-slate-700 hover:bg-slate-600 text-sm">Refresh Library</button>`;
    html += `</div>`;
    c.innerHTML = html;
  } catch (err) {
    c.innerHTML = errorBox(err);
  }
}

// ─── Init ─────────────────────────────────────────────────────
setInterval(() => { if (currentStep === 'library') loadStep(); }, 30000);
loadStep();
</script>
