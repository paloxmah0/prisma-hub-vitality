<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prisma CPC</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/cbor-web@9.0.2/dist/cbor.min.js"></script>
<style>
  body { background: #0a0e14; font-family: 'Inter', system-ui, sans-serif; }
  .glass { background: rgba(20, 28, 40, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.06); }
  .glow { box-shadow: 0 0 20px rgba(34, 197, 94, 0.15); }
  .pulse-dot { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  input, textarea, select { background: #131923; border: 1px solid #2a3548; color: #e2e8f0; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #22c55e; }
  .step-active { color: #22c55e; border-bottom: 2px solid #22c55e; }
  .step { color: #64748b; border-bottom: 2px solid transparent; transition: all 0.2s; }
  .step:hover { color: #94a3b8; }
  .fade-in { animation: fadeIn 0.3s; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
</style>
</head>
<body class="text-slate-200 min-h-screen">

<div class="glass sticky top-0 z-50 px-6 py-3 flex items-center gap-4 flex-wrap">
  <div class="flex items-center gap-2">
    <div class="w-3 h-3 rounded-full bg-green-500 pulse-dot"></div>
    <h1 class="text-lg font-bold tracking-tight">Prisma CPC</h1>
  </div>
  <div class="flex-1"></div>
  <div class="flex items-center gap-2 text-sm">
    <label class="text-slate-500">AppView</label>
    <input id="appview-url" class="rounded px-2 py-1 w-52 text-xs" placeholder="https://appview-pri.onrender.com">
  </div>
  <div class="flex items-center gap-2 text-sm">
    <label class="text-slate-500">PDS</label>
    <input id="pds-url" class="rounded px-2 py-1 w-52 text-xs" placeholder="http://localhost:3000">
  </div>
  <button id="save-config" class="px-3 py-1 rounded bg-slate-700 hover:bg-slate-600 text-xs">Save</button>
  <button id="wallet-btn" class="px-3 py-1 rounded bg-green-600 hover:bg-green-500 text-xs font-medium">Connect Wallet</button>
  <span id="session-status" class="text-xs text-slate-500">Not signed in</span>
</div>

<nav id="stepper" class="px-6 pt-4 flex gap-6 text-sm font-medium">
  <button class="step step-active pb-2" data-step="connect">Connect</button>
  <button class="step pb-2" data-step="register">Register</button>
  <button class="step pb-2" data-step="work">Work</button>
  <button class="step pb-2" data-step="library">Library</button>
</nav>

<main id="content" class="px-6 py-6"></main>
<div id="toast" class="fixed bottom-6 right-6 hidden glass px-4 py-3 rounded-lg text-sm glow"></div>

<script>
// ─── Bech32 ───────────────────────────────────────────────────
const BECH32_ALPHABET = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
const BECH32_ALPHABET_MAP = {};
for (let z = 0; z < BECH32_ALPHABET.length; z++) BECH32_ALPHABET_MAP[BECH32_ALPHABET.charAt(z)] = z;
function bech32PolymodStep(pre){const b=pre>>25;return(((pre&0x1ffffff)<<5)^(-((b>>0)&1)&0x3b6a57b2)^(-((b>>1)&1)&0x26508e6d)^(-((b>>2)&1)&0x1ea119fa)^(-((b>>3)&1)&0x3d4233dd)^(-((b>>4)&1)&0x2a1462b3));}
function bech32PrefixChk(prefix){let chk=1;for(let i=0;i<prefix.length;++i){const c=prefix.charCodeAt(i);if(c<33||c>126)return'Invalid prefix';chk=bech32PolymodStep(chk)^(c>>5);}chk=bech32PolymodStep(chk);for(let i=0;i<prefix.length;++i){chk=bech32PolymodStep(chk)^(prefix.charCodeAt(i)&0x1f);}return chk;}
function bech32Convert(data,inBits,outBits,pad){let value=0,bits=0,maxV=(1<<outBits)-1,result=[];for(let i=0;i<data.length;++i){value=(value<<inBits)|data[i];bits+=inBits;while(bits>=outBits){bits-=outBits;result.push((value>>bits)&maxV);}}if(pad){if(bits>0)result.push((value<<(outBits-bits))&maxV);}else{if(bits>=inBits)return'Excess padding';if((value<<(outBits-bits))&maxV)return'Non-zero padding';}return result;}
function bech32ToWords(bytes){return bech32Convert(bytes,8,5,true);}
function bech32Encode(prefix,words){let chk=bech32PrefixChk(prefix);if(typeof chk==='string')throw new Error(chk);let result=prefix.toLowerCase()+'1';for(let i=0;i<words.length;++i){const x=words[i];if(x>>5!==0)throw new Error('Non 5-bit word');chk=bech32PolymodStep(chk)^x;result+=BECH32_ALPHABET.charAt(x);}for(let i=0;i<6;++i)chk=bech32PolymodStep(chk);chk^=1;for(let i=0;i<6;++i)result+=BECH32_ALPHABET.charAt((chk>>((5-i)*5))&0x1f);return result;}
function hexToStakeAddress(hex){const bytes=[];for(let i=0;i<hex.length;i+=2)bytes.push(parseInt(hex.substr(i,2),16));const isMainnet=(bytes[0]&0x0f)===1;const hrp=isMainnet?'stake':'stake_test';return bech32Encode(hrp,bech32ToWords(bytes));}

// ─── State ────────────────────────────────────────────────────
let appviewUrl = localStorage.getItem('appview-url') || '';
let pdsUrl = localStorage.getItem('pds-url') || '';
let sessionToken = null;
let sessionDid = null;
let walletApi = null;
let rewardAddress = null;
let currentStep = 'connect';
let userRole = null; // 'hub' or 'member'
let hubCreated = false;

document.getElementById('appview-url').value = appviewUrl;
document.getElementById('pds-url').value = pdsUrl;

// ─── Helpers ──────────────────────────────────────────────────
function val(id) { return document.getElementById(id)?.value?.trim() || ''; }
function rkey() { return Math.random().toString(36).slice(2, 12); }
function now() { return new Date().toISOString(); }
function short(str, n = 12) { if (!str) return '—'; return str.length <= n ? str : str.slice(0, n) + '…'; }
function copyable(str) { if (!str) return '<span class="text-slate-600">—</span>'; return `<span class="font-mono text-slate-500 cursor-pointer hover:text-green-400" title="${str}" onclick="navigator.clipboard.writeText('${str}');this.style.color='#22c55e';setTimeout(()=>this.style.color='',1000)">${short(str)}</span>`; }
function toast(msg, isError) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.toggle('text-red-400', !!isError); el.classList.toggle('text-slate-200', !isError); el.classList.remove('hidden'); setTimeout(() => el.classList.add('hidden'), 4000); }
function emptyState(title, sub) { return `<div class="text-center py-16"><div class="text-slate-400 text-lg mb-2">${title}</div><div class="text-slate-600 text-sm">${sub}</div></div>`; }
function errorBox(err) { return `<div class="text-red-400 text-sm">${err.message}</div>`; }

// ─── API ──────────────────────────────────────────────────────
async function appviewGet(path) {
  if (!appviewUrl) throw new Error('Set the AppView URL first');
  const resp = await fetch(`${appviewUrl}${path}`, { signal: AbortSignal.timeout(30000) });
  if (!resp.ok) throw new Error(`AppView ${resp.status}: ${await resp.text()}`);
  return resp.json();
}

async function pdsPost(path, body) {
  if (!pdsUrl) throw new Error('Set the PDS URL first');
  const headers = { 'Content-Type': 'application/json' };
  if (sessionToken) headers['Authorization'] = 'Bearer ' + sessionToken;
  let resp;
  try { resp = await fetch(`${pdsUrl}${path}`, { method: 'POST', headers, body: JSON.stringify(body) }); }
  catch (e) { throw new Error(`Cannot reach PDS (${e.message})`); }
  const text = await resp.text();
  if (!resp.ok) throw new Error(`PDS ${resp.status}: ${text}`);
  return text ? JSON.parse(text) : {};
}

async function pdsUploadBlob(did, arrayBuffer) {
  if (!pdsUrl) throw new Error('Set the PDS URL first');
  const headers = { 'Content-Type': 'application/octet-stream' };
  if (sessionToken) headers['Authorization'] = 'Bearer ' + sessionToken;
  const resp = await fetch(`${pdsUrl}/xrpc/com.prisma.repo.uploadBlob?did=${encodeURIComponent(did)}`, { method: 'POST', headers, body: arrayBuffer });
  const text = await resp.text();
  if (!resp.ok) throw new Error(`PDS ${resp.status}: ${text}`);
  return JSON.parse(text);
}

async function pdsGet(path) {
  if (!pdsUrl) throw new Error('Set the PDS URL first');
  const resp = await fetch(`${pdsUrl}${path}`);
  if (!resp.ok) throw new Error(`PDS ${resp.status}: ${await resp.text()}`);
  return resp.json();
}

// Decode PDS listRecords CBOR
async function pdsListRecords(did, collection) {
  try {
    const data = await pdsGet(`/xrpc/com.prisma.repo.listRecords?did=${encodeURIComponent(did)}&collection=${collection}`);
    return (data.records || []).map(rec => {
      let body = {};
      try { body = cbor.decode(new Uint8Array(rec.bytes || [])); } catch {}
      return { rkey: rec.rkey, cid: rec.cid, body };
    });
  } catch { return []; }
}

// ─── Wallet ───────────────────────────────────────────────────
document.getElementById('wallet-btn').addEventListener('click', walletSignIn);

async function walletSignIn() {
  if (!pdsUrl) { toast('Set the PDS URL first', true); return; }
  try {
    const wallets = Object.keys(window.cardano || {}).filter(k => window.cardano[k].enable);
    if (wallets.length === 0) { toast('No Cardano wallet found', true); return; }

    let enabled = null, walletName = null;
    for (const w of wallets) {
      try { enabled = await window.cardano[w].enable(); walletName = w; walletApi = enabled; break; }
      catch (e) { console.log(w, 'failed:', e.message); }
    }
    if (!enabled) throw new Error('No wallet could be enabled. Is it unlocked?');
    toast(`Connected to ${walletName}`);

    let rewardAddresses;
    try { rewardAddresses = await walletApi.getRewardAddresses(); } catch (e) { throw new Error('getRewardAddresses failed: ' + e.message); }
    if (!rewardAddresses || rewardAddresses.length === 0) throw new Error('No reward address');
    rewardAddress = rewardAddresses[0];
    const stakeAddress = typeof rewardAddress === 'string' && rewardAddress.startsWith('stake')
      ? rewardAddress : hexToStakeAddress(rewardAddress);
    const did = `did:cardano:${stakeAddress}`;

    toast('Requesting challenge...');
    const challenge = await pdsPost('/xrpc/com.prisma.auth.getChallenge', { did });
    const challengeBytes = new TextEncoder().encode(challenge.challenge);
    const hexPayload = Array.from(challengeBytes).map(b => b.toString(16).padStart(2, '0')).join('');

    toast('Waiting for wallet signature...');
    let sigResult;
    try { sigResult = await walletApi.signData(rewardAddress, hexPayload); }
    catch (e) { throw new Error('Wallet rejected signature: ' + e.message); }
    if (!sigResult || !sigResult.signature || !sigResult.key) throw new Error('Wallet did not return a valid signature');

    toast('Signing in...');
    const session = await pdsPost('/xrpc/com.prisma.auth.login', { nonce: challenge.nonce, signature: sigResult.signature, key: sigResult.key });
    sessionToken = session.token;
    sessionDid = session.did;
    localStorage.setItem('last-did', sessionDid);
    const btn = document.getElementById('wallet-btn');
    btn.textContent = 'Signed In'; btn.className = 'px-3 py-1 rounded bg-green-800 text-xs font-medium';
    const st = document.getElementById('session-status');
    st.textContent = short(sessionDid, 20); st.className = 'text-xs text-green-400';
    toast('Signed in!');
    loadStep();
  } catch (err) { console.error('walletSignIn error:', err); toast('Sign-in failed: ' + err.message, true); }
}

// ─── Stepper ──────────────────────────────────────────────────
document.getElementById('save-config').addEventListener('click', () => {
  appviewUrl = document.getElementById('appview-url').value.replace(/\/$/, '');
  pdsUrl = document.getElementById('pds-url').value.replace(/\/$/, '');
  localStorage.setItem('appview-url', appviewUrl);
  localStorage.setItem('pds-url', pdsUrl);
  toast('Config saved'); loadStep();
});

document.querySelectorAll('.step').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.step').forEach(t => t.classList.remove('step-active'));
    btn.classList.add('step-active'); currentStep = btn.dataset.step; loadStep();
  });
});

function loadStep() {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="text-slate-500 text-sm">Loading...</div>';
  switch (currentStep) {
    case 'connect': renderConnect(); break;
    case 'register': renderRegister(); break;
    case 'work': renderWork(); break;
    case 'library': renderLibrary(); break;
  }
}

// ─── Step 1: Connect ──────────────────────────────────────────
function renderConnect() {
  const c = document.getElementById('content');
  const signedIn = sessionToken && sessionDid;
  c.innerHTML = `
    <div class="max-w-2xl mx-auto fade-in">
      <div class="glass rounded-xl p-8 mb-6">
        <h2 class="text-xl font-bold text-green-300 mb-2">Prisma CPC</h2>
        <p class="text-slate-400 text-sm mb-6">Teams do primary research on their PDS. Hubs compile case studies referencing team work. Your data stays on your disk.</p>
        <div class="space-y-3">
          <div class="flex items-center gap-3 ${signedIn ? 'text-green-400' : 'text-slate-500'}"><span>${signedIn ? '✅' : '⬜'}</span><span class="text-sm">Set PDS and AppView URLs (top bar)</span></div>
          <div class="flex items-center gap-3 ${signedIn ? 'text-green-400' : 'text-slate-500'}"><span>${signedIn ? '✅' : '⬜'}</span><span class="text-sm">Connect your Cardano wallet</span></div>
          <div class="flex items-center gap-3 text-slate-500"><span>⬜</span><span class="text-sm">Register as a Hub or Team Member</span></div>
          <div class="flex items-center gap-3 text-slate-500"><span>⬜</span><span class="text-sm">Do your work (primary research or compile case study)</span></div>
          <div class="flex items-center gap-3 text-slate-500"><span>⬜</span><span class="text-sm">Read the Library — all hubs' compiled case studies with linked team evidence</span></div>
        </div>
      </div>
      ${signedIn ? `
        <div class="glass rounded-xl p-6 glow">
          <div class="flex items-center gap-3 mb-4"><span class="text-2xl">✅</span><div><h3 class="font-semibold text-green-300">Wallet connected</h3><div class="text-xs text-slate-500 mt-1">${copyable(sessionDid)}</div></div></div>
          <button onclick="document.querySelector('[data-step=\\'register\\']').click()" class="w-full px-4 py-3 rounded bg-green-600 hover:bg-green-500 text-sm font-medium">Continue →</button>
        </div>
      ` : `
        <div class="glass rounded-xl p-6 text-center">
          <p class="text-slate-400 text-sm mb-4">Click "Connect Wallet" in the top-right to begin.</p>
          <button onclick="walletSignIn()" class="px-6 py-3 rounded bg-green-600 hover:bg-green-500 text-sm font-medium">Connect Wallet</button>
        </div>
      `}
    </div>`;
}

// ─── Step 2: Register ─────────────────────────────────────────
function renderRegister() {
  const c = document.getElementById('content');
  if (!sessionToken) { c.innerHTML = emptyState('Not signed in', 'Connect your wallet first.'); return; }

  // Check if already registered
  c.innerHTML = '<div class="text-slate-500 text-sm">Checking...</div>';
  checkHubExists().then(exists => {
    hubCreated = exists;
    if (exists) {
      // Check what role they registered as
      pdsListRecords(sessionDid, 'prisma.events.enrollment').then(records => {
        if (records.length > 0) {
          const enroll = records[0].body;
          userRole = (enroll.stakeholder_type === '5BkzBo' || enroll.stakeholder_type === '5BkzBo2') ? 'hub' : 'member';
        }
        renderHubOverview();
      }).catch(() => renderHubOverview());
    } else {
      renderRoleChoice();
    }
  }).catch(() => renderRoleChoice());
}

async function checkHubExists() {
  if (!sessionDid) return false;
  try {
    const r = await pdsGet(`/xrpc/com.prisma.sync.getLatestCommit?did=${encodeURIComponent(sessionDid)}`);
    return r.rev && r.rev !== '' && r.rev !== 0;
  } catch { return false; }
}

function renderHubOverview() {
  const c = document.getElementById('content');
  pdsListRecords(sessionDid, 'prisma.events.enrollment').then(records => {
    const enroll = (records[0] || {}).body || {};
    c.innerHTML = `
      <div class="max-w-2xl mx-auto fade-in">
        <div class="glass rounded-xl p-6 mb-6 glow">
          <div class="flex items-center gap-3 mb-4"><span class="text-2xl">✅</span><div><h3 class="font-semibold text-green-300">Registered as ${userRole === 'hub' ? 'Hub' : 'Team Member'}</h3></div></div>
          <div class="space-y-2 text-sm text-slate-300">
            <div><span class="text-slate-600">Name:</span> ${enroll.name || '—'}</div>
            <div><span class="text-slate-600">Role:</span> ${enroll.stakeholder_type || '—'}</div>
            <div><span class="text-slate-600">DID:</span> ${copyable(sessionDid)}</div>
          </div>
        </div>
        <button onclick="document.querySelector('[data-step=\\'work\\']').click()" class="w-full px-4 py-3 rounded bg-green-600 hover:bg-green-500 text-sm font-medium">Go to Work →</button>
      </div>`;
  }).catch(() => {
    c.innerHTML = `<div class="max-w-2xl mx-auto fade-in"><div class="glass rounded-xl p-6 glow"><h3 class="font-semibold text-green-300">Registered</h3><button onclick="document.querySelector('[data-step=\\'work\\']').click()" class="w-full mt-4 px-4 py-3 rounded bg-green-600 hover:bg-green-500 text-sm font-medium">Go to Work →</button></div></div>`;
  });
}

function renderRoleChoice() {
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="max-w-3xl mx-auto fade-in">
      <div class="text-center mb-6"><h2 class="text-xl font-bold text-green-300">Register</h2><p class="text-slate-400 text-sm mt-1">Choose your role in the CPC.</p></div>
      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div class="glass rounded-xl p-6 cursor-pointer hover:border-green-500/30 transition" onclick="selectRole('hub')">
          <div class="text-4xl mb-3">🏛️</div>
          <h3 class="font-semibold text-green-300 mb-2">Hub</h3>
          <p class="text-xs text-slate-500 mb-3">Compiles case studies from team members' primary research. Writes playbook, manages budget and milestones. References team members' records.</p>
          <div class="text-xs text-slate-600">You write: case studies, playbook, budget, milestones</div>
        </div>
        <div class="glass rounded-xl p-6 cursor-pointer hover:border-green-500/30 transition" onclick="selectRole('member')">
          <div class="text-4xl mb-3">🔬</div>
          <h3 class="font-semibold text-green-300 mb-2">Team Member</h3>
          <p class="text-xs text-slate-500 mb-3">Does primary field research. Writes interviews, questionnaires, evidence, photos, videos. Your data stays on your PDS. Hubs reference your work.</p>
          <div class="text-xs text-slate-600">You write: interviews, questionnaires, evidence, videos</div>
        </div>
      </div>
    </div>`;
}

function selectRole(role) {
  userRole = role;
  const c = document.getElementById('content');
  const roleName = role === 'hub' ? 'Hub' : 'Team Member';
  const stakeholderType = role === 'hub' ? '5BkzBo' : 'ODpx0p';

  c.innerHTML = `
    <div class="max-w-2xl mx-auto fade-in">
      <div class="glass rounded-xl p-6 mb-6">
        <div class="text-lg font-semibold text-green-300 mb-4">${roleName}</div>
        <div class="space-y-4">
          <div><label class="text-xs text-slate-500">Name</label><input id="reg-name" class="w-full rounded px-3 py-2 mt-1 text-sm" placeholder="${role === 'hub' ? 'Hub name' : 'Your name'}"></div>
          <div><label class="text-xs text-slate-500">Wallet Address</label><input id="reg-wallet" class="w-full rounded px-3 py-2 mt-1 text-sm" placeholder="addr1..."></div>
          <div><label class="text-xs text-slate-500">Region</label><input id="reg-region" class="w-full rounded px-3 py-2 mt-1 text-sm" placeholder="e.g. Nairobi, Kenya"></div>
        </div>
      </div>
      <div class="flex gap-3">
        <button onclick="renderRoleChoice()" class="px-4 py-2 rounded bg-slate-700 hover:bg-slate-600 text-sm">← Back</button>
        <button id="reg-submit" onclick="submitRegistration('${stakeholderType}')" class="flex-1 px-4 py-3 rounded bg-green-600 hover:bg-green-500 text-sm font-medium">Register →</button>
      </div>
    </div>`;
}

async function submitRegistration(stakeholderType) {
  const btn = document.getElementById('reg-submit');
  if (btn) { btn.disabled = true; btn.textContent = 'Creating...'; }
  try {
    if (!sessionDid) { toast('Not signed in', true); return; }
    const name = val('reg-name'); if (!name) { toast('Name required', true); return; }
    const walletAddress = val('reg-wallet') || 'unknown';

    toast('Creating repo...');
    try { await pdsPost('/xrpc/com.prisma.repo.initiateRepo', { did: sessionDid, stakeholder_type: stakeholderType, name, wallet_address: walletAddress }); }
    catch (e) { if (e.message.includes('409')) toast('Already exists, continuing...'); else throw e; }

    toast('Recording enrollment...');
    await pdsPost('/xrpc/com.prisma.repo.createRecord', {
      collection: 'prisma.events.enrollment', rkey: 'self',
      stakeholder_type: stakeholderType, name, wallet_address: walletAddress,
      did: sessionDid, enrolled_at: now()
    });

    hubCreated = true;
    toast('Registered!');
    setTimeout(() => { document.querySelector('[data-step="work"]').click(); }, 1500);
  } catch (e) { toast(e.message, true); if (btn) { btn.disabled = false; btn.textContent = 'Register →'; } }
}

// ─── Step 3: Work ─────────────────────────────────────────────
function renderWork() {
  const c = document.getElementById('content');
  if (!sessionToken) { c.innerHTML = emptyState('Not signed in', 'Connect your wallet first.'); return; }
  if (!hubCreated) {
    c.innerHTML = `<div class="max-w-2xl mx-auto fade-in"><div class="glass rounded-xl p-6 text-center"><h3 class="text-slate-300 mb-2">Not registered</h3><button onclick="document.querySelector('[data-step=\\'register\\']').click()" class="px-4 py-2 rounded bg-green-600 hover:bg-green-500 text-sm">Register →</button></div></div>`;
    return;
  }

  // Route based on role
  if (userRole === 'hub') renderHubWork();
  else renderMemberWork();
}

// ─── Member Work: primary research ────────────────────────────
async function renderMemberWork() {
  const c = document.getElementById('content');
  c.innerHTML = '<div class="text-slate-500 text-sm">Loading your research...</div>';

  // Load existing records from PDS
  const [interviews, questionnaires, evidence, playbook] = await Promise.all([
    pdsListRecords(sessionDid, 'prisma.events.interview'),
    pdsListRecords(sessionDid, 'prisma.events.playbookSection').then(r => r.filter(x => x.body.section === 'questionnaire')),
    pdsListRecords(sessionDid, 'prisma.events.playbookSection').then(r => r.filter(x => x.body.section === 'evidence' || x.body.section === 'video')),
    pdsListRecords(sessionDid, 'prisma.events.enrollment'),
  ]);

  const enroll = (playbook[0] || {}).body || {};
  const today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

  c.innerHTML = `

async function createInterview() {

    await pdsPost('/xrpc/com.prisma.repo.createRecord', {
      collection: 'prisma.events.interview', rkey: rkey(),
      title, consent: val('iv-consent'), notes: val('iv-notes'),

    });

}

async function createQuestionnaire() {
  try {
    const title = val('q-title'); if (!title) return toast('Title required', true);
    const questions = val('q-questions').split('\n').filter(q => q.trim());
    await pdsPost('/xrpc/com.prisma.repo.createRecord', {
      collection: 'prisma.events.playbookSection', rkey: rkey(),
      hubName: sessionDid, region: val('q-region'), section: 'questionnaire',
      title, content: JSON.stringify(questions), status: 'draft', author: sessionDid, createdAt: now()
    });
    toast('Questionnaire created!');
    setTimeout(() => renderWork(), 1500);
  } catch (e) { toast(e.message, true); }
}

async function uploadEvidence() {
  try {
    const title = val('ev-title'); if (!title) return toast('Title required', true);
    const fileInput = document.getElementById('ev-file');
    if (!fileInput || !fileInput.files || !fileInput.files[0]) return toast('Choose a file', true);
    const file = fileInput.files[0];
    if (file.size > 50 * 1024 * 1024) return toast('File too large (max 50MB)', true);

    toast(`Uploading ${file.name}...`);
    const arrayBuffer = await file.arrayBuffer();
    const blobRes = await pdsUploadBlob(sessionDid, arrayBuffer);

    await pdsPost('/xrpc/com.prisma.repo.createRecord', {
      collection: 'prisma.events.playbookSection', rkey: rkey(),
      hubName: sessionDid, region: 'evidence', section: file.type.startsWith('video/') ? 'video' : 'evidence',
      title, content: `Evidence: ${val('ev-desc') || ''} | CID: ${blobRes.cid}`,
      status: 'published', author: sessionDid, createdAt: now()
    });
    toast('Evidence uploaded!');
    setTimeout(() => renderWork(), 1500);
  } catch (e) { toast(e.message, true); }
}

async function discoverMember() {
  const did = val('team-did');
  if (!did) return toast('Enter a DID', true);
  const el = document.getElementById('member-research');
  el.innerHTML = '<div class="text-slate-500 text-sm">Searching...</div>';

  // Read the member's records from their PDS (via our PDS's getRecord, or via AppView)
  let memberInterviews = [];
  let memberEvidence = [];

  // Try AppView first (if relay synced their PDS)
  try {
    const cs = await appviewGet('/api/research/case-studies');
    memberInterviews = (cs.case_studies || []).flatMap(p => (p.interviews || [])).filter(iv => iv.did === did);
  } catch {}

  // Try reading from their PDS directly (if we know their PDS URL)
  try {
    const records = await pdsListRecords(did, 'prisma.events.interview');
    memberInterviews = memberInterviews.concat(records.map(r => ({ title: r.body.title, consent: r.body.consent, notes: r.body.notes, cid: r.cid })));
  } catch {}

  if (memberInterviews.length === 0) {
    el.innerHTML = `<div class="text-xs text-slate-500">No interviews found for this member. They may not have published yet, or their PDS isn't synced.</div>`;
  } else {
    el.innerHTML = `<div class="text-xs text-slate-400 mb-2">Found ${memberInterviews.length} interviews:</div>${memberInterviews.map(iv => `<div class="border-l-2 border-green-500/30 pl-3 mb-2"><div class="text-sm">${iv.title || 'Untitled'}</div><div class="text-xs text-slate-500">${iv.consent || 'private'} · ${copyable(iv.cid)}</div></div>`).join('')}`;
  }
}

async function renderLibrary() {
  const c = document.getElementById('content');
  c.innerHTML = '<div class="text-slate-500 text-sm">Loading library...</div>';

  try {
    // Get all hubs from AppView
    let hubs = [];
    try { const hubsRes = await appviewGet('/api/research/hubs'); hubs = hubsRes.hubs || []; } catch {}

    // Also read our own PDS records
    let libraryDid = sessionDid || localStorage.getItem('last-did') || '';
    let myRecords = {};
    if (libraryDid && pdsUrl) {
      const collections = ['prisma.events.enrollment', 'prisma.events.project', 'prisma.events.interview', 'prisma.events.milestoneProgress', 'prisma.events.budgetAllocation', 'prisma.events.playbookSection'];
      const results = await Promise.all(collections.map(col => pdsListRecords(libraryDid, col)));
      collections.forEach((col, i) => { myRecords[col] = results[i]; });
    }

    const myEnroll = (myRecords['prisma.events.enrollment'] || [{}])[0] || {};
    const myProjects = myRecords['prisma.events.project'] || [];
    const myInterviews = myRecords['prisma.events.interview'] || [];
    const myMilestones = myRecords['prisma.events.milestoneProgress'] || [];
    const myBudgets = myRecords['prisma.events.budgetAllocation'] || [];
    const myPlaybook = myRecords['prisma.events.playbookSection'] || [];
    const myTotal = myProjects.length + myInterviews.length + myMilestones.length + myBudgets.length + myPlaybook.length;

    if (hubs.length === 0 && myTotal === 0) {
      c.innerHTML = `<div class="max-w-2xl mx-auto fade-in"><div class="glass rounded-xl p-8 text-center"><h2 class="text-lg font-bold text-green-300 mb-2">Library is empty</h2><p class="text-slate-400 text-sm mb-6">No one has published yet.</p>${sessionToken ? `<button onclick="document.querySelector('[data-step=\\'work\\']').click()" class="px-6 py-3 rounded bg-green-600 hover:bg-green-500 text-sm font-medium">Start Working →</button>` : `<button onclick="document.querySelector('[data-step=\\'register\\']').click()" class="px-6 py-3 rounded bg-green-600 hover:bg-green-500 text-sm font-medium">Register →</button>`}</div></div>`;
      return;
    }

    let html = '<div class="max-w-5xl mx-auto fade-in">';
    html += `<div class="text-center mb-6"><h2 class="text-xl font-bold text-green-300">Library</h2><p class="text-slate-400 text-sm mt-1">${hubs.length} hub${hubs.length===1?'':'s'} on AppView · ${myTotal} records on your PDS</p></div>`;

    // Our own records from PDS
    if (myTotal > 0 && libraryDid) {
      const today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      html += `<div class="glass rounded-xl p-6 mb-6" style="font-family: Georgia, serif;">
        <div style="border-top: 3px double #22c55e; border-bottom: 3px double #22c55e; padding: 1rem 0; text-align: center; margin-bottom: 1rem;">
          <div style="font-size: 1.5rem; font-weight: 900; color: #bbf7d0;">${myEnroll.body?.name || 'My Hub'}</div>
          <div style="font-size: 0.7rem; color: #64748b; letter-spacing: 0.15em; text-transform: uppercase; margin-top: 0.3rem;">${myEnroll.body?.stakeholder_type || '—'} · ${today}</div>
          <div style="font-size: 0.65rem; color: #475569; margin-top: 0.2rem;">${copyable(libraryDid)}</div>
        </div>`;

      if (myProjects.length > 0) { html += `<div style="margin-bottom: 1rem;"><div style="font-size: 0.65rem; color: #22c55e; text-transform: uppercase;">Case Studies</div>`;
        for (const p of myProjects) { html += `<p style="font-size: 0.85rem; color: #cbd5e1; margin: 0.3rem 0;"><strong>${p.body.name || 'Untitled'}</strong> — ${p.body.impactArea || '—'}`; if (p.body.referencedMembers) { html += ` · References: ${p.body.referencedMembers.length} member(s)`; } html += `</p>`; }
        html += `</div>`; }

      if (myInterviews.length > 0) { html += `<div style="margin-bottom: 1rem;"><div style="font-size: 0.65rem; color: #22c55e; text-transform: uppercase;">Primary Research (${myInterviews.length})</div>`;
        for (const iv of myInterviews) { const cColor = iv.body.consent === 'public' ? '#22c55e' : iv.body.consent === 'anonymous' ? '#eab308' : '#ef4444';
          html += `<p style="font-size: 0.85rem; color: #cbd5e1; margin: 0.3rem 0;"><strong>${iv.body.title || 'Untitled'}</strong> <span style="color:${cColor}; font-size:0.7rem;">${iv.body.consent || 'private'}</span></p>`; }
        html += `</div>`; }

      if (myMilestones.length > 0) { html += `<div style="margin-bottom: 1rem;"><div style="font-size: 0.65rem; color: #22c55e; text-transform: uppercase;">Milestones</div>`;
        for (const m of myMilestones) { const done = m.body.status === 'done'; html += `<p style="font-size: 0.85rem; color: #cbd5e1;">${done ? '■' : '□'} <strong>${m.body.milestone || '—'}</strong> — ${m.body.status || '—'}</p>`; }
        html += `</div>`; }

      if (myBudgets.length > 0) { html += `<div style="margin-bottom: 1rem;"><div style="font-size: 0.65rem; color: #22c55e; text-transform: uppercase;">Budget</div>`;
        for (const b of myBudgets) { html += `<p style="font-size: 0.85rem; color: #cbd5e1;">Total: ${b.body.totalAda || '0'} ADA · Earned: ${b.body.earnedAda || '0'} ADA</p>`; }

      if (myPlaybook.length > 0) { html += `<div style="margin-bottom: 1rem;"><div style="font-size: 0.65rem; color: #22c55e; text-transform: uppercase;">Playbook & Evidence</div>`;
        for (const p of myPlaybook) { html += `<p style="font-size: 0.85rem; color: #cbd5e1;"><strong>${p.body.title || '—'}</strong> — ${p.body.section || '—'}</p>`; }

      html += `<div style="text-align: center; color: #22c55e; font-size: 0.8rem; letter-spacing: 0.5em;">■ ■ ■</div></div>`;
    }

    // Other hubs from AppView
    for (const hub of hubs) {
      if (hub.did === libraryDid) continue;
      html += `<div class="glass rounded-xl p-6 mb-4"><h3 class="font-semibold text-green-300">${hub.name}</h3><div class="text-xs text-slate-500 mt-1">${hub.stakeholder_type} · ${copyable(hub.did)}</div></div>`;
    }

    html += `<button onclick="renderLibrary()" class="w-full px-4 py-3 rounded bg-slate-700 hover:bg-slate-600 text-sm mt-4">Refresh</button></div>`;
    c.innerHTML = html;
  } catch (err) { c.innerHTML = errorBox(err); }
}

// ─── Init ─────────────────────────────────────────────────────
loadStep();
</script>
</body>
</html>
