<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Prisma Hub Vitality</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://cdn.jsdelivr.net/npm/cbor-web@9.0.2/dist/cbor.min.js"></script>
<style>
  body { background: #0a0e14; font-family: 'Inter', system-ui, sans-serif; }
  .glass { background: rgba(20, 28, 40, 0.6); backdrop-filter: blur(12px); border: 1px solid rgba(255,255,255,0.06); }
  .glow { box-shadow: 0 0 20px rgba(34, 197, 94, 0.15); }
  .vitality-bar { background: linear-gradient(90deg, #22c55e, #14b8a6); }
  .pulse-dot { animation: pulse 2s infinite; }
  @keyframes pulse { 0%,100%{opacity:1} 50%{opacity:0.4} }
  ::-webkit-scrollbar { width: 6px; } ::-webkit-scrollbar-thumb { background: #334155; border-radius: 3px; }
  input, textarea, select { background: #131923; border: 1px solid #2a3548; color: #e2e8f0; }
  input:focus, textarea:focus, select:focus { outline: none; border-color: #22c55e; }
  .step-active { color: #22c55e; border-bottom: 2px solid #22c55e; }
  .step { color: #64748b; border-bottom: 2px solid transparent; transition: all 0.2s; }
  .step:hover { color: #94a3b8; }
  .fade-in { animation: fadeIn 0.3s; }
  @keyframes fadeIn { from{opacity:0;transform:translateY(8px)} to{opacity:1;transform:none} }
</style>
</head>
<body class="text-slate-200 min-h-screen">

<div class="glass sticky top-0 z-50 px-6 py-3 flex items-center gap-4 flex-wrap">
  <div class="flex items-center gap-2">
    <div class="w-3 h-3 rounded-full bg-green-500 pulse-dot"></div>
    <h1 class="text-lg font-bold tracking-tight">Prisma Hub Vitality</h1>
  </div>
  <div class="flex-1"></div>
  <div class="flex items-center gap-2 text-sm">
    <label class="text-slate-500">AppView</label>
    <input id="appview-url" class="rounded px-2 py-1 w-52 text-xs" placeholder="https://prisma-indexer.onrender.com">
  </div>
  <div class="flex items-center gap-2 text-sm">
    <label class="text-slate-500">PDS</label>
    <input id="pds-url" class="rounded px-2 py-1 w-52 text-xs" placeholder="http://localhost:3000">
  </div>
  <button id="save-config" class="px-3 py-1 rounded bg-slate-700 hover:bg-slate-600 text-xs">Save</button>
  <button id="wallet-btn" class="px-3 py-1 rounded bg-green-600 hover:bg-green-500 text-xs font-medium">Connect Wallet</button>
  <span id="session-status" class="text-xs text-slate-500">Not signed in</span>
</div>

<nav id="stepper" class="px-6 pt-4 flex gap-6 text-sm font-medium">
  <button class="step step-active pb-2" data-step="connect">Connect</button>
  <button class="step pb-2" data-step="register">Register</button>
  <button class="step pb-2" data-step="publish">Publish</button>
  <button class="step pb-2" data-step="library">Library</button>
</nav>

<main id="content" class="px-6 py-6"></main>
<div id="toast" class="fixed bottom-6 right-6 hidden glass px-4 py-3 rounded-lg text-sm glow"></div>

<script>
// ─── Bech32 ───────────────────────────────────────────────────
const BECH32_ALPHABET = 'qpzry9x8gf2tvdw0s3jn54khce6mua7l';
const BECH32_ALPHABET_MAP = {};
for (let z = 0; z < BECH32_ALPHABET.length; z++) BECH32_ALPHABET_MAP[BECH32_ALPHABET.charAt(z)] = z;
function bech32PolymodStep(pre){const b=pre>>25;return(((pre&0x1ffffff)<<5)^(-((b>>0)&1)&0x3b6a57b2)^(-((b>>1)&1)&0x26508e6d)^(-((b>>2)&1)&0x1ea119fa)^(-((b>>3)&1)&0x3d4233dd)^(-((b>>4)&1)&0x2a1462b3));}
function bech32PrefixChk(prefix){let chk=1;for(let i=0;i<prefix.length;++i){const c=prefix.charCodeAt(i);if(c<33||c>126)return'Invalid prefix';chk=bech32PolymodStep(chk)^(c>>5);}chk=bech32PolymodStep(chk);for(let i=0;i<prefix.length;++i){chk=bech32PolymodStep(chk)^(prefix.charCodeAt(i)&0x1f);}return chk;}
function bech32Convert(data,inBits,outBits,pad){let value=0,bits=0,maxV=(1<<outBits)-1,result=[];for(let i=0;i<data.length;++i){value=(value<<inBits)|data[i];bits+=inBits;while(bits>=outBits){bits-=outBits;result.push((value>>bits)&maxV);}}if(pad){if(bits>0)result.push((value<<(outBits-bits))&maxV);}else{if(bits>=inBits)return'Excess padding';if((value<<(outBits-bits))&maxV)return'Non-zero padding';}return result;}
function bech32ToWords(bytes){return bech32Convert(bytes,8,5,true);}
function bech32Encode(prefix,words){let chk=bech32PrefixChk(prefix);if(typeof chk==='string')throw new Error(chk);let result=prefix.toLowerCase()+'1';for(let i=0;i<words.length;++i){const x=words[i];if(x>>5!==0)throw new Error('Non 5-bit word');chk=bech32PolymodStep(chk)^x;result+=BECH32_ALPHABET.charAt(x);}for(let i=0;i<6;++i)chk=bech32PolymodStep(chk);chk^=1;for(let i=0;i<6;++i)result+=BECH32_ALPHABET.charAt((chk>>((5-i)*5))&0x1f);return result;}
function hexToStakeAddress(hex){const bytes=[];for(let i=0;i<hex.length;i+=2)bytes.push(parseInt(hex.substr(i,2),16));const isMainnet=(bytes[0]&0x0f)===1;const hrp=isMainnet?'stake':'stake_test';return bech32Encode(hrp,bech32ToWords(bytes));}

// ─── State ────────────────────────────────────────────────────
let appviewUrl = localStorage.getItem('appview-url') || '';
let pdsUrl = localStorage.getItem('pds-url') || '';
let sessionToken = null;
let sessionDid = null;
let walletApi = null;
let rewardAddress = null;
let currentStep = 'connect';
let hubCreated = false;
let selectedRole = null;
let selectedRoleName = null;

document.getElementById('appview-url').value = appviewUrl;
document.getElementById('pds-url').value = pdsUrl;

// ─── Helpers ──────────────────────────────────────────────────
function val(id) { return document.getElementById(id)?.value?.trim() || ''; }
function rkey() { return Math.random().toString(36).slice(2, 12); }
function now() { return new Date().toISOString(); }
function short(str, n = 12) { if (!str) return '—'; return str.length <= n ? str : str.slice(0, n) + '…'; }
function copyable(str) { if (!str) return '<span class="text-slate-600">—</span>'; return `<span class="font-mono text-slate-500 cursor-pointer hover:text-green-400" title="${str}" onclick="navigator.clipboard.writeText('${str}');this.style.color='#22c55e';setTimeout(()=>this.style.color='',1000)">${short(str)}</span>`; }
function toast(msg, isError) { const el = document.getElementById('toast'); el.textContent = msg; el.classList.toggle('text-red-400', !!isError); el.classList.toggle('text-slate-200', !isError); el.classList.remove('hidden'); setTimeout(() => el.classList.add('hidden'), 4000); }
function emptyState(title, sub) { return `<div class="text-center py-16"><div class="text-slate-400 text-lg mb-2">${title}</div><div class="text-slate-600 text-sm">${sub}</div></div>`; }
function errorBox(err) { return `<div class="text-red-400 text-sm">${err.message}</div>`; }

// ─── API ──────────────────────────────────────────────────────
// AppView: pure JSON GET, CORS *, no auth needed for public data
async function appviewGet(path) {
  if (!appviewUrl) throw new Error('Set the AppView URL first');
  const resp = await fetch(`${appviewUrl}${path}`);
  if (!resp.ok) throw new Error(`AppView ${resp.status}: ${await resp.text()}`);
  return resp.json();
}

// PDS JSON POST: sends JSON, returns JSON
async function pdsPost(path, body) {
  if (!pdsUrl) throw new Error('Set the PDS URL first');
  const headers = { 'Content-Type': 'application/json' };
  if (sessionToken) headers['Authorization'] = 'Bearer ' + sessionToken;
  let resp;
  try {
    resp = await fetch(`${pdsUrl}${path}`, { method: 'POST', headers, body: JSON.stringify(body) });
  } catch (e) { throw new Error(`Cannot reach PDS at ${pdsUrl} (${e.message})`); }
  const text = await resp.text();
  if (!resp.ok) throw new Error(`PDS ${resp.status}: ${text}`);
  return text ? JSON.parse(text) : {};
}

// PDS raw bytes upload: application/octet-stream, NOT JSON
async function pdsUploadBlob(did, arrayBuffer) {
  if (!pdsUrl) throw new Error('Set the PDS URL first');
  const headers = { 'Content-Type': 'application/octet-stream' };
  if (sessionToken) headers['Authorization'] = 'Bearer ' + sessionToken;
  let resp;
  try {
    resp = await fetch(`${pdsUrl}/xrpc/com.prisma.repo.uploadBlob?did=${encodeURIComponent(did)}`, {
      method: 'POST', headers, body: arrayBuffer
    });
  } catch (e) { throw new Error(`Cannot reach PDS for upload (${e.message})`); }
  const text = await resp.text();
  if (!resp.ok) throw new Error(`PDS ${resp.status}: ${text}`);
  return JSON.parse(text);
}

// PDS GET (no auth): getLatestCommit, listRecords, getBlob
async function pdsGet(path) {
  if (!pdsUrl) throw new Error('Set the PDS URL first');
  const resp = await fetch(`${pdsUrl}${path}`);
  if (!resp.ok) throw new Error(`PDS ${resp.status}: ${await resp.text()}`);
  return resp.json();
}

// ─── Wallet ───────────────────────────────────────────────────
document.getElementById('wallet-btn').addEventListener('click', walletSignIn);

async function walletSignIn() {
  if (!pdsUrl) { toast('Set the PDS URL first', true); return; }
  try {
    const wallets = Object.keys(window.cardano || {}).filter(k => window.cardano[k].enable);
    if (wallets.length === 0) { toast('No Cardano wallet found', true); return; }

    // Try each wallet until one works
    let enabled = null, walletName = null;
    for (const w of wallets) {
      try { enabled = await window.cardano[w].enable(); walletName = w; walletApi = enabled; break; }
      catch (e) { console.log(w, 'failed:', e.message); }
    }
    if (!enabled) throw new Error('No wallet could be enabled. Is it unlocked?');
    toast(`Connected to ${walletName}`);

    let rewardAddresses;
    try { rewardAddresses = await walletApi.getRewardAddresses(); } catch (e) { throw new Error('getRewardAddresses failed: ' + e.message); }
    if (!rewardAddresses || rewardAddresses.length === 0) throw new Error('No reward address');
    rewardAddress = rewardAddresses[0];
    const stakeAddress = typeof rewardAddress === 'string' && rewardAddress.startsWith('stake')
      ? rewardAddress : hexToStakeAddress(rewardAddress);
    const did = `did:cardano:${stakeAddress}`;

    toast('Requesting challenge...');
    const challenge = await pdsPost('/xrpc/com.prisma.auth.getChallenge', { did });
    const challengeBytes = new TextEncoder().encode(challenge.challenge);
    const hexPayload = Array.from(challengeBytes).map(b => b.toString(16).padStart(2, '0')).join('');

    toast('Waiting for wallet signature...');
    let sigResult;
    try { sigResult = await walletApi.signData(rewardAddress, hexPayload); }
    catch (e) { throw new Error('Wallet rejected signature: ' + e.message); }
    if (!sigResult || !sigResult.signature || !sigResult.key) throw new Error('Wallet did not return a valid signature');

    toast('Signing in...');
    const session = await pdsPost('/xrpc/com.prisma.auth.login', { nonce: challenge.nonce, signature: sigResult.signature, key: sigResult.key });
    sessionToken = session.token;
    sessionDid = session.did;
    const btn = document.getElementById('wallet-btn');
    btn.textContent = 'Signed In'; btn.className = 'px-3 py-1 rounded bg-green-800 text-xs font-medium';
    const st = document.getElementById('session-status');
    st.textContent = short(sessionDid, 20); st.className = 'text-xs text-green-400';
    toast('Signed in!');
    updateStepper(); loadStep();
  } catch (err) { console.error('walletSignIn error:', err); toast('Sign-in failed: ' + err.message, true); }
}

// ─── Stepper ──────────────────────────────────────────────────
document.getElementById('save-config').addEventListener('click', () => {
  appviewUrl = document.getElementById('appview-url').value.replace(/\/$/, '');
  pdsUrl = document.getElementById('pds-url').value.replace(/\/$/, '');
  localStorage.setItem('appview-url', appviewUrl);
  localStorage.setItem('pds-url', pdsUrl);
  toast('Config saved'); loadStep();
});

document.querySelectorAll('.step').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.step').forEach(t => t.classList.remove('step-active'));
    btn.classList.add('step-active'); currentStep = btn.dataset.step; loadStep();
  });
});

function updateStepper() {
  ['connect','register','publish','library'].forEach((s) => {
    const btn = document.querySelector(`[data-step="${s}"]`);
    if (!btn) return;
    btn.classList.remove('step-active');
    if (s === currentStep) btn.classList.add('step-active');
  });
}

function loadStep() {
  const content = document.getElementById('content');
  content.innerHTML = '<div class="text-slate-500 text-sm">Loading...</div>';
  updateStepper();
  switch (currentStep) {
    case 'connect': renderConnect(); break;
    case 'register': renderRegister(); break;
    case 'publish': renderPublish(); break;
    case 'library': renderLibrary(); break;
  }
}

// ─── Step 1: Connect ──────────────────────────────────────────
function renderConnect() {
  const c = document.getElementById('content');
  const signedIn = sessionToken && sessionDid;
  c.innerHTML = `
    <div class="max-w-2xl mx-auto fade-in">
      <div class="glass rounded-xl p-8 mb-6">
        <h2 class="text-xl font-bold text-green-300 mb-2">Welcome to Prisma Hub Vitality</h2>
        <p class="text-slate-400 text-sm mb-6">Your data stays on your disk. Signed, content-addressed, yours.</p>
        <div class="space-y-3">
          <div class="flex items-center gap-3 ${signedIn ? 'text-green-400' : 'text-slate-500'}"><span>${signedIn ? '✅' : '⬜'}</span><span class="text-sm">Set PDS and AppView URLs (top bar)</span></div>
          <div class="flex items-center gap-3 ${signedIn ? 'text-green-400' : 'text-slate-500'}"><span>${signedIn ? '✅' : '⬜'}</span><span class="text-sm">Connect your Cardano wallet</span></div>
          <div class="flex items-center gap-3 text-slate-500"><span>⬜</span><span class="text-sm">Register your hub</span></div>
          <div class="flex items-center gap-3 text-slate-500"><span>⬜</span><span class="text-sm">Publish research (projects, interviews, milestones, budgets, team, playbook, video)</span></div>
          <div class="flex items-center gap-3 text-slate-500"><span>⬜</span><span class="text-sm">Read the Library — all hubs' published research</span></div>
        </div>
      </div>
      ${signedIn ? `
        <div class="glass rounded-xl p-6 glow">
          <div class="flex items-center gap-3 mb-4"><span class="text-2xl">✅</span><div><h3 class="font-semibold text-green-300">Wallet connected</h3><div class="text-xs text-slate-500 mt-1">${copyable(sessionDid)}</div></div></div>
          <button onclick="document.querySelector('[data-step=\\'register\\']').click()" class="w-full px-4 py-3 rounded bg-green-600 hover:bg-green-500 text-sm font-medium">Continue →</button>
        </div>
      ` : `
        <div class="glass rounded-xl p-6 text-center">
          <p class="text-slate-400 text-sm mb-4">Click "Connect Wallet" in the top-right to begin.</p>
          <button onclick="walletSignIn()" class="px-6 py-3 rounded bg-green-600 hover:bg-green-500 text-sm font-medium">Connect Wallet</button>
        </div>
      `}
    </div>`;
}

// ─── Step 2: Register ─────────────────────────────────────────
const STAKEHOLDER_TYPES = [
  { name: 'Participant', id: 'ODpx0p', icon: '👤' },
  { name: 'Community of Place', id: '5BkzBo', icon: '🌍' },
  { name: 'Community of Practice', id: 'n9J7rK', icon: '🔗' },
  { name: 'Partner', id: 'wQB7El', icon: '🤝' },
];

function renderRegister() {
  const c = document.getElementById('content');
  if (!sessionToken) { c.innerHTML = emptyState('Not signed in', 'Connect your wallet first.'); return; }
  c.innerHTML = '<div class="text-slate-500 text-sm">Checking...</div>';
  checkHubExists().then(exists => {
    hubCreated = exists;
    if (exists) renderHubOverview();
    else renderRoleSelection();
  }).catch(() => renderRoleSelection());
}

async function checkHubExists() {
  if (!sessionDid) return false;
  try {
    const r = await pdsGet(`/xrpc/com.prisma.sync.getLatestCommit?did=${encodeURIComponent(sessionDid)}`);
    return r.rev > 0;
  } catch { return false; }
}

async function renderHubOverview() {
  const c = document.getElementById('content');
  let hubInfo = null;
  try { const hubsRes = await appviewGet('/api/research/hubs'); hubInfo = (hubsRes.hubs || []).find(h => h.did === sessionDid); } catch {}
  c.innerHTML = `
    <div class="max-w-2xl mx-auto fade-in">
      <div class="glass rounded-xl p-6 mb-6 glow">
        <div class="flex items-center gap-3 mb-4"><span class="text-2xl">✅</span><div><h3 class="font-semibold text-green-300">Hub registered</h3></div></div>
        ${hubInfo ? `<div class="space-y-2 text-sm text-slate-300">
          <div><span class="text-slate-600">Name:</span> ${hubInfo.name}</div>
          <div><span class="text-slate-600">Role:</span> ${hubInfo.stakeholder_type}</div>
          <div><span class="text-slate-600">DID:</span> ${copyable(hubInfo.did)}</div>
          <div><span class="text-slate-600">Wallet:</span> ${copyable(hubInfo.wallet_address)}</div>
        </div>` : '<div class="text-xs text-slate-500">Hub exists on PDS, waiting for indexer...</div>'}
      </div>
      <button onclick="document.querySelector('[data-step=\\'publish\\']').click()" class="w-full px-4 py-3 rounded bg-green-600 hover:bg-green-500 text-sm font-medium">Publish Research →</button>
    </div>`;
  hubCreated = true;
}

function renderRoleSelection() {
  const c = document.getElementById('content');
  if (selectedRole) { renderRegDetails(); return; }
  c.innerHTML = `
    <div class="max-w-3xl mx-auto fade-in">
      <div class="text-center mb-6"><h2 class="text-xl font-bold text-green-300">Choose your role</h2></div>
      <div class="grid grid-cols-1 md:grid-cols-4 gap-4">
        ${STAKEHOLDER_TYPES.map(t => `<div class="glass rounded-xl p-6 cursor-pointer hover:border-green-500/30 transition text-center" onclick="selectRole('${t.id}','${t.name}')"><div class="text-4xl mb-3">${t.icon}</div><h3 class="font-semibold text-green-300">${t.name}</h3></div>`).join('')}
      </div>
    </div>`;
}

function selectRole(id, name) { selectedRole = id; selectedRoleName = name; renderRegDetails(); }

function renderRegDetails() {
  const c = document.getElementById('content');
  c.innerHTML = `
    <div class="max-w-2xl mx-auto fade-in">
      <div class="glass rounded-xl p-6 mb-6">
        <div class="text-lg font-semibold text-green-300 mb-4">${selectedRoleName}</div>
        <div class="space-y-4">
          <div><label class="text-xs text-slate-500">Name</label><input id="reg-name" class="w-full rounded px-3 py-2 mt-1 text-sm" placeholder="Your name or hub name"></div>
          <div><label class="text-xs text-slate-500">Wallet Address</label><input id="reg-wallet" class="w-full rounded px-3 py-2 mt-1 text-sm" placeholder="addr1..."></div>
          <div><label class="text-xs text-slate-500">Region</label><input id="reg-region" class="w-full rounded px-3 py-2 mt-1 text-sm" placeholder="e.g. Nairobi, Kenya"></div>
        </div>
      </div>
      <div class="flex gap-3">
        <button onclick="selectedRole=null;selectedRoleName=null;renderRoleSelection()" class="px-4 py-2 rounded bg-slate-700 hover:bg-slate-600 text-sm">← Back</button>
        <button id="reg-submit" onclick="submitRegistration()" class="flex-1 px-4 py-3 rounded bg-green-600 hover:bg-green-500 text-sm font-medium">Register & Create Hub →</button>
      </div>
    </div>`;
}

async function submitRegistration() {
  const btn = document.getElementById('reg-submit');
  if (btn) { btn.disabled = true; btn.textContent = 'Creating...'; }
  try {
    if (!sessionDid) { toast('Not signed in', true); return; }
    const name = val('reg-name'); if (!name) { toast('Name required', true); return; }
    const stakeholderType = selectedRole || 'ODpx0p';
    const walletAddress = val('reg-wallet') || 'unknown';
    const region = val('reg-region');

    // 1. initiateRepo (creates repo + internal enrollment at rkey="self")
    toast('Creating hub repo...');
    try { await pdsPost('/xrpc/com.prisma.repo.initiateRepo', { did: sessionDid, stakeholder_type: stakeholderType, name, wallet_address: walletAddress }); }
    catch (e) { if (e.message.includes('409')) toast('Hub already exists, continuing...'); else throw e; }

    // 2. createRecord enrollment (emits RecordCreated so indexer projects it)
    toast('Recording enrollment...');
    await pdsPost('/xrpc/com.prisma.repo.createRecord', {
      collection: 'prisma.events.enrollment', rkey: 'self',
      stakeholder_type: stakeholderType, name, wallet_address: walletAddress,
      did: sessionDid, enrolled_at: now()
    });

    // 3. createRecord project if region
    if (region) {
      toast('Creating project...');
      await pdsPost('/xrpc/com.prisma.repo.createRecord', {
        collection: 'prisma.events.project', rkey: rkey(),
        name, impactArea: region, createdAt: now()
      });
    }

    hubCreated = true;
    toast('Hub registered!');
    setTimeout(() => { document.querySelector('[data-step="publish"]').click(); }, 1500);
  } catch (e) { toast(e.message, true); if (btn) { btn.disabled = false; btn.textContent = 'Register & Create Hub →'; } }
}

// ─── Step 3: Publish ───────────────────────────────────────────
// Uses the existing collections with EXACT field names the indexer expects.
// All records in one publish share a batch prefix so they're linked.
function renderPublish() {
  const c = document.getElementById('content');
  if (!sessionToken) { c.innerHTML = emptyState('Not signed in', 'Connect your wallet first.'); return; }
  c.innerHTML = '<div class="text-slate-500 text-sm">Loading...</div>';

  // Get commit history from PDS
  Promise.all([
    pdsGet(`/xrpc/com.prisma.sync.getLatestCommit?did=${encodeURIComponent(sessionDid)}`).catch(() => null),
    pdsGet(`/xrpc/com.prisma.repo.listRecords?did=${encodeURIComponent(sessionDid)}&collection=prisma.events.enrollment`).catch(() => ({ records: [] })),
    pdsGet(`/xrpc/com.prisma.repo.listRecords?did=${encodeURIComponent(sessionDid)}&collection=prisma.events.project`).catch(() => ({ records: [] })),
    pdsGet(`/xrpc/com.prisma.repo.listRecords?did=${encodeURIComponent(sessionDid)}&collection=prisma.events.interview`).catch(() => ({ records: [] })),
    pdsGet(`/xrpc/com.prisma.repo.listRecords?did=${encodeURIComponent(sessionDid)}&collection=prisma.events.milestoneProgress`).catch(() => ({ records: [] })),
    pdsGet(`/xrpc/com.prisma.repo.listRecords?did=${encodeURIComponent(sessionDid)}&collection=prisma.events.budgetAllocation`).catch(() => ({ records: [] })),
    pdsGet(`/xrpc/com.prisma.repo.listRecords?did=${encodeURIComponent(sessionDid)}&collection=prisma.events.localTeam`).catch(() => ({ records: [] })),
    pdsGet(`/xrpc/com.prisma.repo.listRecords?did=${encodeURIComponent(sessionDid)}&collection=prisma.events.playbookSection`).catch(() => ({ records: [] })),
  ]).then(([latestCommit, enroll, proj, iv, ms, bg, lt, pb]) => {
    const totalRev = latestCommit ? latestCommit.rev : 0;
    const counts = {
      enrollment: (enroll.records || []).length,
      project: (proj.records || []).length,
      interview: (iv.records || []).length,

async function publishAll() {
  const btn = document.getElementById('pub-submit');
  if (btn) { btn.disabled = true; btn.textContent = 'Publishing...'; }
  const results = [];

  try {
    // Upload video first (raw bytes via application/octet-stream)
    const vidFile = document.getElementById('vid-file');
    if (vidFile && vidFile.files && vidFile.files[0]) {
      const file = vidFile.files[0];
      if (file.size > 50 * 1024 * 1024) { toast('Video too large (max 50MB)', true); }
      else {
        toast(`Uploading video (${Math.round(file.size / 1024 / 1024 * 10) / 10}MB)...`);
        try {
          const arrayBuffer = await file.arrayBuffer();
          const blobRes = await pdsUploadBlob(sessionDid, arrayBuffer);
          console.log('Blob uploaded:', blobRes);
          // Store video reference as a playbook section (indexer projects it)
          await pdsPost('/xrpc/com.prisma.repo.createRecord', {
            collection: 'prisma.events.playbookSection', rkey: rkey(),
            hubName: sessionDid, region: 'media', section: 'video',
            title: file.name, content: 'Video CID: ' + blobRes.cid,
            status: 'published', author: sessionDid, createdAt: now()
          });
          results.push('Video');
        } catch (e) { console.error('Video upload error:', e); toast('Video upload failed: ' + e.message, true); }
      }
    }

    // Project (field names: name, impactArea, createdAt — camelCase!)
    if (val('p-name')) {
      toast('Writing project...');
      await pdsPost('/xrpc/com.prisma.repo.createRecord', {
        collection: 'prisma.events.project', rkey: rkey(),
        name: val('p-name'), impactArea: val('p-impact'), createdAt: now()
      });
      results.push('Project');
    }

    // Interview (field names: title, subject:{uri,cid}, consent, notes, createdAt)
    if (val('iv-title')) {
      toast('Writing interview...');
      await pdsPost('/xrpc/com.prisma.repo.createRecord', {
        collection: 'prisma.events.interview', rkey: rkey(),
        title: val('iv-title'), subject: { uri: '', cid: '' },
        consent: val('iv-consent'), notes: val('iv-notes'), createdAt: now()
      });
      results.push('Interview');
    }

    // Milestone (field names: hubName, milestone, status, completedAt — camelCase!)
    if (val('ms-name')) {
      toast('Writing milestone...');
      await pdsPost('/xrpc/com.prisma.repo.createRecord', {
        collection: 'prisma.events.milestoneProgress', rkey: rkey(),
        hubName: val('p-name') || 'Hub', milestone: val('ms-name'),
        status: val('ms-status'), completedAt: now()
      });
      results.push('Milestone');
    }

    // Budget (field names: hubName, location, totalAda, earnedAda, interviewsDone, interviewsTarget, playbookStatus)
    if (val('bg-total') || val('bg-earned')) {
      toast('Writing budget...');
      await pdsPost('/xrpc/com.prisma.repo.createRecord', {
        collection: 'prisma.events.budgetAllocation', rkey: rkey(),
        hubName: val('p-name') || 'Hub', location: val('bg-loc'),
        totalAda: val('bg-total') || '0', earnedAda: val('bg-earned') || '0',
        interviewsDone: parseInt(val('bg-done')) || 0, interviewsTarget: parseInt(val('bg-target')) || 0,
        playbookStatus: 'draft'
      });
      results.push('Budget');
    }

    // Local team (field names: teamName, teamDid, walletAddress, hubName, region, interviewsDone, earnedAda)
    if (val('lt-name')) {
      toast('Writing team member...');
      await pdsPost('/xrpc/com.prisma.repo.createRecord', {
        collection: 'prisma.events.localTeam', rkey: rkey(),
        teamName: val('lt-name'), teamDid: val('lt-did'),
        walletAddress: val('lt-wallet'), hubName: sessionDid,
        region: val('lt-region'), interviewsDone: 0, earnedAda: '0'
      });
      results.push('Team');
    }

    // Playbook (field names: hubName, region, section, title, content, status, author, createdAt)
    if (val('pb-title')) {
      toast('Writing playbook section...');
      await pdsPost('/xrpc/com.prisma.repo.createRecord', {
        collection: 'prisma.events.playbookSection', rkey: rkey(),
        hubName: sessionDid, region: val('pb-region'), section: val('pb-section'),
        title: val('pb-title'), content: val('pb-content'),
        status: 'published', author: sessionDid, createdAt: now()
      });
      results.push('Playbook');
    }

    toast(`Published: ${results.join(', ')}`);
    if (btn) { btn.disabled = false; btn.textContent = 'Publish →'; }
    setTimeout(() => { document.querySelector('[data-step="library"]').click(); }, 2000);
  } catch (e) { console.error('publishAll error:', e); toast(e.message, true); if (btn) { btn.disabled = false; btn.textContent = 'Publish →'; } }
}

// ─── Step 4: Library ──────────────────────────────────────────
// Reads from the AppView (pure JSON, already projected by the indexer)
// ─── Step 4: Library ──────────────────────────────────────────
// Reads directly from the PDS (always up-to-date) AND the AppView (cross-hub).
// The PDS is the source of truth — the relay/indexer/AppView are derived.
// Like Bluesky: writes go to PDS, reads can come from PDS or AppView.

// Decode a PDS listRecords response — bytes are CBOR (DAG-CBOR)
async function pdsListRecords(did, collection) {
  try {
    const data = await pdsGet(`/xrpc/com.prisma.repo.listRecords?did=${encodeURIComponent(did)}&collection=${collection}`);
    return (data.records || []).map(rec => {
      let body = {};
      try { body = cbor.decode(new Uint8Array(rec.bytes || [])); } catch { try { body = JSON.parse(new TextDecoder().decode(new Uint8Array(rec.bytes || []))); } catch {} }
      return { rkey: rec.rkey, cid: rec.cid, body };
    });
  } catch { return []; }
}

async function renderLibrary() {
  const c = document.getElementById('content');
  c.innerHTML = '<div class="text-slate-500 text-sm">Loading library from PDS...</div>';

  try {
    // First try AppView (cross-hub, but may be empty if relay is broken)
    let appviewHubs = [], appviewCs = [], appviewEc = null;
    try {
      const [hubsRes, csRes, ecRes] = await Promise.all([
        appviewGet('/api/research/hubs'),
        appviewGet('/api/research/case-studies'),
        appviewGet('/api/research/event-contract')
      ]);
      appviewHubs = hubsRes.hubs || [];
      appviewCs = csRes.case_studies || [];
      appviewEc = ecRes;
    } catch {}

    // Then read directly from PDS (our own records — always current)
    let myRecords = {};
    if (sessionDid && pdsUrl) {
      const collections = [
        'prisma.events.enrollment', 'prisma.events.project', 'prisma.events.interview',
        'prisma.events.milestoneProgress', 'prisma.events.budgetAllocation',
        'prisma.events.localTeam', 'prisma.events.playbookSection'
      ];
      const results = await Promise.all(collections.map(col => pdsListRecords(sessionDid, col)));
      collections.forEach((col, i) => { myRecords[col] = results[i]; });
    }

    // Build a unified hub list: AppView hubs + our own PDS enrollment
    let allHubs = [...appviewHubs];
    if (myRecords['prisma.events.enrollment'] && myRecords['prisma.events.enrollment'].length > 0) {
      const enroll = myRecords['prisma.events.enrollment'][0].body;
      if (!allHubs.find(h => h.did === sessionDid)) {
        allHubs.push({
          did: sessionDid, name: enroll.name || 'My Hub',
          stakeholder_type: enroll.stakeholder_type || '—',
          wallet_address: enroll.wallet_address || '—',
          enrolled_at: enroll.enrolled_at || '—',
          cid: myRecords['prisma.events.enrollment'][0].cid
        });
      }
    }

    // Count my PDS records
    const myCounts = {
      project: (myRecords['prisma.events.project'] || []).length,
      interview: (myRecords['prisma.events.interview'] || []).length,
      milestone: (myRecords['prisma.events.milestoneProgress'] || []).length,
      budget: (myRecords['prisma.events.budgetAllocation'] || []).length,
      team: (myRecords['prisma.events.localTeam'] || []).length,
      playbook: (myRecords['prisma.events.playbookSection'] || []).length,
    };
    const myTotal = Object.values(myCounts).reduce((a, b) => a + b, 0);

    if (allHubs.length === 0 && appviewCs.length === 0 && myTotal === 0) {
      c.innerHTML = `<div class="max-w-2xl mx-auto fade-in"><div class="glass rounded-xl p-8 text-center">
        <h2 class="text-lg font-bold text-green-300 mb-2">The Library is empty</h2>
        <p class="text-slate-400 text-sm mb-6">No hubs have published yet.</p>
        ${sessionToken ? `<button onclick="document.querySelector('[data-step=\\'publish\\']').click()" class="px-6 py-3 rounded bg-green-600 hover:bg-green-500 text-sm font-medium">Publish Research →</button>`
          : `<button onclick="document.querySelector('[data-step=\\'register\\']').click()" class="px-6 py-3 rounded bg-green-600 hover:bg-green-500 text-sm font-medium">Register Your Hub →</button>`}
      </div></div>`;
      return;
    }

    let html = '<div class="max-w-5xl mx-auto fade-in">';
    html += `<div class="text-center mb-6"><h2 class="text-xl font-bold text-green-300">The Research Library</h2>`;
    html += `<p class="text-slate-400 text-sm mt-1">${allHubs.length} hub${allHubs.length===1?'':'s'} · ${myTotal} records on your PDS · ${appviewCs.length} on AppView</p></div>`;

    // AppView cross-hub data (if available)
    if (appviewEc) {
      const budgets = appviewEc.budgets || [];
      const totalDone = budgets.reduce((s, b) => s + b.interviews_done, 0);
      const totalTarget = budgets.reduce((s, b) => s + b.interviews_target, 0);
      const pct = totalTarget > 0 ? Math.round((totalDone / totalTarget) * 100) : 0;

        html += `<div class="glass rounded-xl p-6 mb-6">
          <h3 class="text-sm font-medium text-slate-300 mb-3">Cross-hub Progress (AppView)</h3>
          <div class="w-full bg-slate-800 rounded-full h-4 overflow-hidden mb-2"><div class="vitality-bar h-4 rounded-full" style="width: ${pct}%"></div></div>

    // Show our own hub's records from the PDS (always current, no relay needed)
    if (myTotal > 0 && sessionDid) {
      const today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });

      }
      const pbSections = playbook.filter(p => p.body.section !== 'video');
      if (pbSections.length > 0) {
        html += `<div style="margin-bottom: 1rem;"><div style="font-size: 0.65rem; letter-spacing: 0.15em; text-transform: uppercase; color: #22c55e;">Playbook (${pbSections.length})</div>`;
        for (const p of pbSections) { html += `<p style="font-size: 0.85rem; color: #cbd5e1; margin: 0.3rem 0;"><strong>${p.body.title || '—'}</strong> — ${p.body.section || '—'}. <em style="color:#94a3b8">${p.body.status || '—'}</em></p>`; }
        html += `</div>`;
      }

      html += `<div style="text-align: center; color: #22c55e; font-size: 0.8rem; letter-spacing: 0.5em;">■ ■ ■</div></div>`;
    }

    // Show other hubs from AppView (if relay is working)
    for (const hub of appviewHubs) {
      if (hub.did === sessionDid) continue; // already shown above
      const hProjs = appviewCs.filter(cs => cs.did === hub.did);
      const hMs = (appviewEc?.milestones || []).filter(m => m.did === hub.did);
      const hBg = (appviewEc?.budgets || []).filter(b => b.did === hub.did);
      const hTeams = (appviewEc?.local_teams || []).filter(t => t.did === hub.did);
      const hPb = (appviewEc?.playbook_sections || []).filter(p => p.did === hub.did);
      const total = hProjs.length + hMs.length + hBg.length + hTeams.length + hPb.length;
      if (total === 0) continue;

      const today = new Date().toLocaleDateString('en-US', { year: 'numeric', month: 'long', day: 'numeric' });
      html += `<div class="glass rounded-xl p-6 mb-6" style="font-family: Georgia, serif;">
        <div style="border-top: 3px double #22c55e; border-bottom: 3px double #22c55e; padding: 1rem 0; text-align: center; margin-bottom: 1rem;">
          <div style="font-size: 1.5rem; font-weight: 900; color: #bbf7d0;">${hub.name}</div>
          <div style="font-size: 0.7rem; color: #64748b; letter-spacing: 0.15em; text-transform: uppercase; margin-top: 0.3rem;">${hub.stakeholder_type} · ${today}</div>
        </div>`;
      if (hProjs.length > 0) { html += `<div style="margin-bottom: 1rem;"><div style="font-size: 0.65rem; color: #22c55e; text-transform: uppercase;">Case Studies</div>`;
        for (const p of hProjs) { html += `<p style="font-size: 0.85rem; color: #cbd5e1;"><strong>${p.name}</strong> — ${p.impact_area || '—'}</p>`; } html += `</div>`; }
      if (hMs.length > 0) { html += `<div style="margin-bottom: 1rem;"><div style="font-size: 0.65rem; color: #22c55e; text-transform: uppercase;">Milestones</div>`;
        for (const m of hMs) { html += `<p style="font-size: 0.85rem; color: #cbd5e1;">■ <strong>${m.milestone}</strong> — ${m.status}</p>`; } html += `</div>`; }
      html += `<div style="text-align: center; color: #22c55e; font-size: 0.8rem; letter-spacing: 0.5em;">■ ■ ■</div></div>`;
    }

    html += `<button onclick="renderLibrary()" class="w-full px-4 py-3 rounded bg-slate-700 hover:bg-slate-600 text-sm mt-4">Refresh Library</button></div>`;
    c.innerHTML = html;
  } catch (err) { c.innerHTML = errorBox(err); }
}

// ─── Init ─────────────────────────────────────────────────────
loadStep();
</script>
</body>
</html>
